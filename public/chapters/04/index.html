 for(const o of origins.slice(0,W<=650?2:4)){const cord=sg.createLinearGradient(o.x,0,o.x,Math.max(1,o.top));cord.addColorStop(0,'#cdb38b00');cord.addColorStop(.55,'#cdb38b16');cord.addColorStop(1,'#cdb38b5c');sg.strokeStyle=cord;sg.lineWidth=.6;sg.beginPath();sg.moveTo(o.x,0);sg.lineTo(o.x,o.top);sg.stroke()}
 for(const s of stars){const drift=reduced.matches?0:Math.sin(time*.14+s.p)*10;glow(sg,s.x+drift,s.y,s.r*3,'225,213,178',.08);sg.fillStyle='rgba(230,224,191,'+(reduced.matches?.13:.12+Math.sin(time*.5+s.p)*.07)+')';sg.beginPath();sg.arc(s.x+drift,s.y,s.r,0,7);sg.fill()}
 g.clearRect(0,0,W,H);const warmth=[0,0,0,0];
 for(const e of effects){e.age+=dt;if(e.i===0)waterEffect(e);else if(e.i===1)lightEffect(e,warmth);else if(e.i===2)flowersEffect(e);else starsEffect(e)}effects=effects.filter(e=>e.age<5);
 [...vials.children].forEach((b,i)=>b.style.setProperty('--warmth',warmth[i].toFixed(3)));
 if(finalAge>=0){finalAge+=dt;bloom()}
}
function tick(now){frame=0;if(document.hidden)return;const dt=last?Math.min(.05,(now-last)/1000):0;last=now;draw(dt);if(!reduced.matches)frame=requestAnimationFrame(tick)}function start(){if(!frame&&!document.hidden){last=0;frame=requestAnimationFrame(tick)}}
document.getElementById('reset').addEventListener('click',()=>{soundscape.clearNotes();selected.clear();particles=[];effects=[];finalAge=-1;for(const b of vials.children)b.setAttribute('aria-pressed','false');for(const d of document.querySelectorAll('.dot')){d.style.fill='';d.style.filter=''}document.getElementById('footer').classList.remove('complete');const m=document.getElementById('message');m.classList.remove('complete');m.textContent='Toca un frasco. Escucha lo que guarda para ti.';draw(0);start()});document.addEventListener('visibilitychange',()=>{document.documentElement.dataset.paused=String(document.hidden);soundscape.visibility();if(document.hidden){cancelAnimationFrame(frame);frame=0}else start()});reduced.addEventListener('change',()=>{cancelAnimationFrame(frame);frame=0;particles=[];effects=[];start()});
const soundscape=(()=>{
 const button=document.getElementById('sound');let context=null,master=null,reverb=null,wet=null,enabled=false,chosen=false,epoch=0,ambient=null,ambienceGain=null,nextBird=11,notes=new Set();
 function ui(){button.setAttribute('aria-pressed',String(enabled));button.setAttribute('aria-label',enabled?'Silenciar sonido':'Activar sonido');button.title=enabled?'Silenciar sonido':'Activar sonido'}
 function connect(source,gain){source.connect(gain);gain.connect(master);gain.connect(wet);notes.add(source);source.onended=()=>{notes.delete(source);source.disconnect();gain.disconnect()}}
 function create(){if(context)return;const Native=window.AudioContext||window.webkitAudioContext;if(!Native)throw Error('Audio no disponible');context=new Native();master=context.createGain();master.gain.value=0;const compressor=context.createDynamicsCompressor();compressor.threshold.value=-18;compressor.ratio.value=3;master.connect(compressor);compressor.connect(context.destination);
 reverb=context.createConvolver();const length=Math.floor(context.sampleRate*1.65),impulse=context.createBuffer(2,length,context.sampleRate);for(let ch=0;ch<2;ch++){const data=impulse.getChannelData(ch);for(let n=0;n<length;n++)data[n]=(Math.random()*2-1)*Math.pow(1-n/length,3.6)*.25}reverb.buffer=impulse;wet=context.createGain();wet.gain.value=.22;wet.connect(reverb);reverb.connect(master);
 const buffer=context.createBuffer(1,context.sampleRate*2,context.sampleRate),noise=buffer.getChannelData(0);let filtered=0;for(let i=0;i<noise.length;i++){filtered=(filtered+(Math.random()*2-1)*.035)/1.035;noise[i]=filtered}ambient=context.createBufferSource();ambient.buffer=buffer;ambient.loop=true;const low=context.createBiquadFilter();low.type='lowpass';low.frequency.value=950;const high=context.createBiquadFilter();high.type='highpass';high.frequency.value=190;ambienceGain=context.createGain();ambienceGain.gain.value=.07;ambient.connect(low);low.connect(high);high.connect(ambienceGain);ambienceGain.connect(master);ambient.start();
 }
 async function sync(){if(!context)return;try{if(enabled&&!document.hidden){await context.resume();if(enabled&&!document.hidden)master.gain.setTargetAtTime(.29,context.currentTime,.16);else await context.suspend()}else{master.gain.cancelScheduledValues(context.currentTime);master.gain.setValueAtTime(0,context.currentTime);await context.suspend()}}catch{enabled=false;ui()}}
 async function gesture(){const token=epoch;if(!chosen){chosen=true;enabled=true}if(!enabled)return false;try{create();await sync();ui();return token===epoch&&enabled&&!document.hidden&&context.state==='running'}catch{enabled=false;ui();button.title='El sonido no pudo iniciarse en este navegador';return false}}
 function note(freq,at,length=.9,volume=.15,type='sine'){if(!enabled||!context||document.hidden)return;const t=context.currentTime+at,osc=context.createOscillator(),gain=context.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+length);connect(osc,gain);osc.start(t);osc.stop(t+length+.03)}
 function bell(freq,at,volume=.11){note(freq,at,1.8,volume);note(freq*2.01,at,1.05,volume*.25);note(freq*3.98,at,.55,volume*.08)}
 function drop(freq,at){if(!enabled||!context)return;const t=context.currentTime+at,o=context.createOscillator(),v=context.createGain();o.frequency.setValueAtTime(freq*1.55,t);o.frequency.exponentialRampToValueAtTime(freq,t+.15);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.16,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+.42);connect(o,v);o.start(t);o.stop(t+.45)}
 function chirp(){if(!enabled||!context||document.hidden)return;for(let n=0;n<2;n++){const t=context.currentTime+n*.15,o=context.createOscillator(),v=context.createGain();o.frequency.setValueAtTime(1750+n*190,t);o.frequency.exponentialRampToValueAtTime(2700+n*100,t+.075);o.frequency.exponentialRampToValueAtTime(2100,t+.13);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.019,t+.025);v.gain.exponentialRampToValueAtTime(.0001,t+.14);connect(o,v);o.start(t);o.stop(t+.16)}}
 function wish(i,completion){if(!enabled)return;if(i===0){drop(660,0);drop(880,.19);bell(392,.31,.07)}if(i===1){bell(523.25,0,.12);bell(783.99,.16,.075)}if(i===2){[392,493.88,587.33].forEach((f,n)=>bell(f,n*.15,.085))}if(i===3){[783.99,987.77,1174.66].forEach((f,n)=>bell(f,n*.17,.075))}if(completion)[392,493.88,587.33,783.99,987.77].forEach((f,n)=>bell(f,3.35+n*.22,.075))}
 function clearNotes(){epoch++;for(const n of notes){try{n.stop()}catch{}}notes.clear();nextBird=time+11}
 button.addEventListener('click',async()=>{chosen=true;enabled=!enabled;epoch++;if(!enabled){clearNotes();ui();await sync();return}const ready=await gesture();if(ready)bell(587.33,0,.06)});
 return{gesture,wish,clearNotes,visibility(){void sync()},update(time){if(!enabled||!context||document.hidden)return;if(time>nextBird){nextBird=time+15+Math.random()*13;chirp()}}};
})();
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,100)});addEventListener('scroll',geometry,{passive:true});resize();start();
</script>
