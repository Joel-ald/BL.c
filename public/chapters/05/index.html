'use strict';

const R=(name,formula,color,detail)=>({name,formula,color,detail});
const data=[
{id:'garden',name:'Un jardín mineral',sub:'Pequeños tallos que nunca fueron plantas.',family:'Crecimiento',icon:'♧',color:'#86c9b3',tag:['SILICATOS','SiO₃²⁻','jardín mineral'],poetic:'Cultivar lo imposible.',desc:'Las sales metálicas forman membranas de precipitado al entrar en una solución de silicato. El movimiento del agua y la rotura de esas membranas permiten que aparezcan tubos que recuerdan a un jardín.',eq:'Sal metálica + silicato →<br>membranas y tubos minerales',observe:'Observa cómo las estructuras crecen desde el fondo. Son minerales, aunque parezcan pequeñas plantas.',reagents:[R('Silicato de sodio','Na₂SiO₃','#9ecbd3','solución acuosa'),R('Sulfato de cobre(II)','CuSO₄','#68bed8','sal · semilla mineral'),R('Cloruro de hierro(III)','FeCl₃','#d1a569','sal · semilla mineral')],duration:11,result:'Han crecido tubos minerales. El proceso real combina precipitación, ósmosis y flujo; aquí su crecimiento está acelerado.',source:'https://news.fsu.edu/news/science-technology/2023/07/03/planting-seeds-fsu-researchers-dig-into-how-chemical-gardens-grow/'},
{id:'luminol',name:'Luz en un frasco',sub:'Un instante de azul nacido de la química.',family:'Quimioluminiscencia',icon:'✧',color:'#8fd8ff',tag:['LUMINOL','C₈H₇N₃O₂','luz química'],poetic:'Guardar un poco de luz.',desc:'La oxidación del luminol puede formar un producto en estado excitado. Cuando pierde esa energía, emite luz azul. El brillo dura un tiempo y se apaga a medida que se consumen los reactivos.',eq:'Energía química → luz azul<br><small>oxidación del luminol</small>',observe:'Los remolinos se iluminan desde dentro y el resplandor termina por desvanecerse.',reagents:[R('Luminol','C₈H₇N₃O₂','#a4ccdf','en medio alcalino'),R('Oxidante','NaClO','#d3dfb0','hipoclorito de sodio')],duration:10,result:'La emisión azul es quimioluminiscencia. La luz procede de la reacción, y su intensidad disminuye al avanzar.',source:'https://edu.rsc.org/resources/chemiluminescence-of-luminol-a-cold-light-experiment/823.article'},
{id:'bottle',name:'El azul que despierta',sub:'Agita. Espera. Vuelve a descubrirlo.',family:'Oxidación · reducción',icon:'↝',color:'#68abe8',tag:['INDICADOR','MB','azul de metileno'],poetic:'A veces, basta moverse.',desc:'En el sistema de la botella azul, la glucosa reduce el indicador en medio alcalino. Al agitar, el oxígeno del aire vuelve a oxidarlo y recupera el azul. En reposo se decolora de nuevo.',eq:'MB reducido ⇄ MB oxidado<br><small>incoloro ⇄ azul</small>',observe:'Prepara el sistema y agítalo con el botón. Espera a que el azul desaparezca para volver a intentarlo.',reagents:[R('Glucosa','C₆H₁₂O₆','#d8dbc2','agente reductor'),R('Azul de metileno','MB','#7c9fde','indicador redox'),R('Hidróxido de sodio','NaOH','#bcd2d5','medio alcalino')],duration:8,result:'El indicador vuelve a su forma reducida. Puedes agitar otra vez: en un sistema real, los ciclos terminan cuando se agotan los reactivos.',source:'https://vrchemistry.chem.ox.ac.uk/FilmStudio/bluebottle/HTML/page02.htm'},
{id:'clock',name:'El instante azul',sub:'Hay cambios que llegan sin avisar.',family:'Cinética química',icon:'◷',color:'#a7adeb',tag:['RELOJ','I₂','yodo · almidón'],poetic:'La paciencia tiene color.',desc:'En un reloj de yodo, un reductor consume el yodo que se va formando. Cuando ese reductor se agota, el yodo se acumula y aparece de golpe el color oscuro del complejo con almidón.',eq:'Yodo + almidón →<br>complejo azul oscuro',observe:'Durante unos segundos parece que nada sucede. Busca el momento exacto del cambio.',reagents:[R('Yodato de potasio','KIO₃','#d1dace','precursor de yodo'),R('Sistema reductor','HSO₃⁻','#c3cfd9','bisulfito · sistema ácido'),R('Almidón','(C₆H₁₀O₅)ₙ','#c6c9e7','indicador')],duration:8,result:'El cambio brusco representa el agotamiento del reductor y la acumulación de yodo. La espera aquí es ilustrativa.',source:'https://chem.rutgers.edu/cldf-demos/1030-cldf-demo-reaction-rate'},
{id:'music',name:'Una melodía de yodo',sub:'Cinco instantes. Una pequeña canción.',family:'Química + música',icon:'♪',color:'#d2bcdf',tag:['SECUENCIA','I₂','relojes de yodo'],poetic:'Escuchar un descubrimiento.',desc:'Varios relojes de yodo pueden prepararse para cambiar en momentos diferentes. Aquí cada cambio dispara una nota: la reacción tiene base química y la melodía es una interpretación artística.',eq:'Cambio de color → una nota<br><small>cinco relojes · cinco momentos</small>',observe:'Activa el sonido si quieres escuchar cómo cada frasco aporta una nota al conjunto.',reagents:[R('Yodato de potasio','KIO₃','#b7caca','precursor de yodo'),R('Sistema reductor','HSO₃⁻','#c9c9da','esperas ilustrativas'),R('Almidón','(C₆H₁₀O₅)ₙ','#c5c2dc','indicador')],duration:10,result:'Cada cambio ha disparado una nota. Una demostración de Rutgers también coordina relojes de yodo con música.',source:'https://chem.rutgers.edu/cldf-demos/1030-cldf-demo-reaction-rate'},
{id:'silver',name:'Un bosque de plata',sub:'Metal brillante, creciendo lentamente.',family:'Desplazamiento',icon:'Ag',color:'#c8dbe1',tag:['PLATA','Ag','depósito metálico'],poetic:'Ver nacer el brillo.',desc:'El cobre cede electrones a los iones de plata. Se deposita plata metálica sobre el cobre, mientras los iones de cobre(II) que pasan a la solución le dan color azul.',eq:'Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag',observe:'Sigue las ramificaciones plateadas sobre el cobre y el azul que aparece en el líquido.',reagents:[R('Cobre','Cu','#d5a07e','metal'),R('Nitrato de plata','AgNO₃','#d6e4e5','solución acuosa')],duration:11,result:'La plata se ha depositado sobre el cobre. El color azul corresponde al cobre(II) en solución. Crecimiento acelerado.',source:'https://chem.washington.edu/lecture-demos/replacement-reaction-silver-copper'},
{id:'copper',name:'Más allá del azul',sub:'Una gota cambia. Un exceso transforma.',family:'Complejación',icon:'Cu',color:'#7badef',tag:['COBRE(II)','Cu²⁺','complejos en solución'],poetic:'Descubrir otra profundidad.',desc:'Al añadir amoniaco a una solución de cobre(II), aparece un precipitado azul claro. Con amoniaco en exceso, ese sólido se disuelve y predomina un complejo de azul intenso.',eq:'Cu(OH)₂(s) →<br>[Cu(NH₃)₄(H₂O)₂]²⁺<br><small>con amoniaco en exceso · esquema</small>',observe:'Primero forma el precipitado. Después usa «Añadir exceso» para descubrir el segundo cambio.',reagents:[R('Sulfato de cobre(II)','CuSO₄','#64b5dc','solución acuosa'),R('Amoniaco','NH₃','#c6dbe2','adición inicial')],duration:7,result:'Aparece hidróxido de cobre(II) azul claro. Aún queda una transformación: añade amoniaco en exceso.',source:'https://edu.rsc.org/experiments/an-equilibrium-using-copperii-and-ammonia/1711.article'},
{id:'oscillate',name:'El pulso del color',sub:'Un frasco, varios cambios inesperados.',family:'Reacción oscilante',icon:'∞',color:'#e0bc85',tag:['OSCILACIÓN','I₂','sistema Briggs–Rauscher'],poetic:'Nada permanece quieto.',desc:'Una red de reacciones que compiten puede hacer oscilar el color entre ámbar y azul oscuro, con intervalos casi incoloros. Los ciclos se detienen cuando el sistema consume sus reactivos.',eq:'Sistema Briggs–Rauscher<br><small>varias reacciones acopladas</small>',observe:'El color vuelve a cambiar sin añadir otro frasco. La secuencia termina: no es un ciclo perpetuo.',reagents:[R('Peróxido de hidrógeno','H₂O₂','#cbdbdf','componente oxidante'),R('Yodato de potasio','KIO₃','#dec38d','en medio ácido'),R('Sistema reactivo','CH₂(COOH)₂','#c5b7d8','ác. malónico · Mn²⁺ · almidón')],duration:14,result:'La oscilación ha terminado en azul oscuro. El ritmo mostrado es ilustrativo, no un cálculo de cinética.',source:'https://www.chem.indiana.edu/faculty-research/faculty-resources/chemistry-demos/demo/oscillating-clock-reaction/'},
{id:'precip',name:'Una nube sumergida',sub:'Dos soluciones. Un nuevo sólido.',family:'Precipitación',icon:'↓',color:'#9cdde4',tag:['PRECIPITADO','Cu(OH)₂','hidróxido de cobre(II)'],poetic:'También hay nubes aquí.',desc:'Los iones cobre(II) y los iones hidróxido forman hidróxido de cobre(II), un sólido poco soluble de color azul claro. La nube que ves representa ese precipitado dentro del agua.',eq:'Cu²⁺ + 2 OH⁻ → Cu(OH)₂ ↓',observe:'Mira cómo aparece una nube azul clara y parte del sólido se acumula en el fondo.',reagents:[R('Sulfato de cobre(II)','CuSO₄','#77bddd','solución acuosa'),R('Hidróxido de sodio','NaOH','#c3d9d7','solución acuosa')],duration:8,result:'Se ha formado un sólido nuevo: hidróxido de cobre(II). El azul turbio no es simplemente una mezcla de tintes.',source:'https://www2.chem.wisc.edu/deptfiles/genchem/lab/cca/MVHTM/CUSO/CUSONAOH.HTM'},

function drawFalling(){ctx.save();ctx.translate(54,83);ctx.scale(.82,.82);for(const g of grains){ctx.fillStyle=rgb(g.color,.95);ctx.strokeStyle='#70819a';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(g.x,g.y-g.r);ctx.lineTo(g.x+g.r,g.y);ctx.lineTo(g.x,g.y+g.r);ctx.lineTo(g.x-g.r,g.y);ctx.closePath();ctx.fill();ctx.stroke()}for(const d of drops){ctx.fillStyle=rgb(d.color,.7);ctx.strokeStyle='#e9f7eea0';ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(d.x,d.y,d.r,d.r*1.9,0,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function musicGlass(i){return `<svg viewBox="0 0 100 165" aria-hidden="true"><defs><clipPath id="musicClip${i}"><path d="M37 24h26v34c0 15 27 29 27 57 0 29-18 38-40 38S10 144 10 115c0-28 27-42 27-57Z"/></clipPath></defs><ellipse cx="50" cy="156" rx="38" ry="5" fill="#55436b33"/><path d="M37 24h26v34c0 15 27 29 27 57 0 29-18 38-40 38S10 144 10 115c0-28 27-42 27-57Z" fill="#c5d6e777" stroke="#62617e" stroke-width="3"/><g clip-path="url(#musicClip${i})"><path class="music-fill" d="M7 105q43 7 86 0v55H7Z" fill="#b9cce359"/></g><path d="M25 98q-9 19-1 32M43 32v28" stroke="#f0f1eccc" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="35" y="12" width="30" height="18" rx="5" fill="#cba396" stroke="#70607b" stroke-width="2.5"/><path d="M42 17h13" stroke="#e8c2ad" stroke-width="3" stroke-linecap="round"/><g transform="rotate(${i%2?4:-4} 50 125)"><rect x="28" y="112" width="44" height="24" rx="5" fill="#f0dfc7" stroke="#ad9bb0" stroke-width="1"/><text x="50" y="128" text-anchor="middle" font-family="Georgia" font-size="12" fill="#685e7d">I₂</text></g></svg>`}

function updateReactionNavigation(){const busy=!!pour||running;$('#reaction-prev').disabled=busy;$('#reaction-next').disabled=busy}
function centerReaction(instant=false){if(innerWidth>700)return;const shelf=$('#experiments'),item=shelf.querySelector('[aria-pressed="true"]');if(!item)return;const a=shelf.getBoundingClientRect(),b=item.getBoundingClientRect();shelf.scrollTo({left:shelf.scrollLeft+b.left-a.left+b.width/2-a.width/2,behavior:instant||reduced.matches?'instant':'smooth'})}
function stepReaction(direction){if(innerWidth>700||pour||running)return;choose((current+direction+data.length)%data.length);$('#live').textContent=data[current].name}
$('#reaction-prev').onclick=()=>stepReaction(-1);$('#reaction-next').onclick=()=>stepReaction(1);
let sceneTouch=null,suppressSceneClickUntil=0;
$('.scene').addEventListener('pointerdown',e=>{if(innerWidth>700||pour||running||!e.isPrimary)return;sceneTouch={id:e.pointerId,x:e.clientX,y:e.clientY}});
$('.scene').addEventListener('pointerup',e=>{const start=sceneTouch;sceneTouch=null;if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.4){suppressSceneClickUntil=performance.now()+450;stepReaction(dx<0?1:-1)}});
$('.scene').addEventListener('pointercancel',()=>sceneTouch=null);
$('.scene').addEventListener('click',e=>{if(performance.now()<suppressSceneClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
$('#experiments').addEventListener('keydown',e=>{if(innerWidth<=700&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();stepReaction(e.key==='ArrowRight'?1:-1);$('#experiments').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true})}});
window.addEventListener('resize',()=>requestAnimationFrame(()=>centerReaction(true)));

function resize(){const scale=Math.min(devicePixelRatio||1,innerWidth<700?1.5:2,window.__BLANCA_WORLD__?.pixelRatio??1);canvas.width=600*scale;canvas.height=500*scale;ctx.setTransform(scale,0,0,scale,0,0);draw(0)}
addEventListener('blanca:state',()=>{last=performance.now();resize()});
function frame(now){raf=0;if(document.hidden)return;const dt=Math.max(0,(now-last)/1000||0);last=now;const physicalDt=Math.min(dt,.1);if(pour||running||settle>0){if(!reduced.matches)updateFluid(physicalDt);settle=Math.max(0,settle-physicalDt)}if(!reduced.matches)advanceFalling(dt);if(pour){pour.age+=dt;const q=ease(Math.max(0,Math.min(1,(pour.age-.9)/1.65)));level=pour.start+(pour.target-pour.start)*q;if(pour.age>=3.5)completePour()}if(running){elapsed+=dt;const d=data[current];if(d.id==='music'){const count=Math.min(5,Math.max(0,Math.floor((elapsed-1.5)/1.3)+1));for(let i=musicPlayed;i<count;i++){const b=$('#music-mini').children[i];b.classList.add('lit');b.querySelector('.music-fill').setAttribute('fill','#343879');tone([523.25,659.25,783.99,880,1046.5][i],0,1.6)}musicPlayed=count}if(elapsed>=d.duration){elapsed=d.duration;finish()}}draw(reduced.matches?0:now/1000);if(running||pour||settle>0||drops.length||grains.some(g=>g.y<434))raf=requestAnimationFrame(frame)}
function wake(){if(reduced.matches&&!running&&!pour)settle=0;if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('paused',document.hidden);if(document.hidden)souvenirAnim?.pause();else souvenirAnim?.play();if(document.hidden){cancelAnimationFrame(raf);raf=0;quiet();audioCtx?.suspend()}else{if(soundEnabled)audioCtx?.resume().catch(()=>{});wake()}});window.addEventListener('resize',resize);reduced.addEventListener('change',()=>draw(0));resize();choose(0);
</script></body></html>
