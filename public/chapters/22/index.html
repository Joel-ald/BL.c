<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),world=$('#world'),canvas=$('#scene'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),TAU=Math.PI*2;
const TOOLS=[
['hand','Mano','✋',0],['box','Guante','🥊',0],['bat','Bate','🏏',0],['hammer','Martillo','🔨',0],['press','Prensa','🧇',0],
['cut','Tijeras','✂️',1],['fire','Fuego','🔥',1],['ice','Hielo','❄️',1],['acid','Ácido de fantasía','🧪',1],['water','Agua','💧',1],
['shock','Chispa','⚡',2],['fan','Ventilador','🌬️',2],['tornado','Tornado','🌪️',2],['magnet','Imán','🧲',2],['metal','Polvo metálico','🔩',2],
['inflate','Inflador','🎈',3],['vacuum','Aspiradora','🌀',3],['glue','Pegamento','🧴',3],['paint','Pintura','🎨',3],['feather','Cosquillas','🪶',3]
].map(([id,name,icon,group])=>({id,name,icon,group}));
const PAIRS=[['ice','bat','Granizado con ojitos'],['inflate','feather','Risa a presión'],['glue','fan','Bandera de gelatina'],['metal','magnet','Gel magnético'],['paint','tornado','Remolino de colores'],['press','fire','Gofre tostado'],['water','ice','Cubito sorpresa'],['acid','inflate','Fiesta de espuma'],['glue','cut','Separados, pero pegados'],['paint','box','Una firma en la pared'],['inflate','ice','Bola de hielo'],['tornado','fire','Remolino calentito'],['ice','fire','Deshielo exprés'],['fire','ice','Crujiente por fuera']];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,tones=['#f0ddd9','#deebea','#e5dfef','#eee5d5'];
let W=0,H=0,S=1,dpr=1,CX=0,FLOOR=0,time=0,prev=0,raf=0,lastRender=0,hostVisible=true,modal=false,selected='hand',sound=false,audio=null,master=null;
let nodes=[],particles=[],pieces=[],stamps=[],pointer=null,bodyX=0,bodyV=0,bodyY=0,bodyVY=0,landing=0,blastAt=-10,shake=0,gesture=null,comboQueue=[],queueIndex=0,latest='',lastUse=-10,badgeUntil=0,expressionUntil=0,expression='smug',effect={id:'',born:-10,x:0,y:0},gripX=0,gripY=0;
const neutral=()=>({hot:0,frozen:0,acid:0,wet:0,glue:0,metal:0,inflated:0,flat:0,shock:0,spin:0,fan:0,vacuum:0,paint:0,waffle:0,marble:0,foam:0,crack:0,stretch:0});let st=neutral();const colors=['#ae789b','#6caabd','#9baf80','#d2a368','#ac95c6'];let paintIndex=0;
const bubbles=Array.from({length:12},(_,i)=>({x:Math.sin(i*2.4)*.68,y:.13+(i%5)*.15,r:2+i%4}));const metallic=Array.from({length:34},(_,i)=>({x:Math.sin(i*4.33)*.77,y:.1+(i%11)*.071,r:1.4+i%3*.5}));
function oval(x,y,rx,ry,fill,angle=0){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),angle,0,TAU);ctx.fill()}
function line(points,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
function dimensions(){return{rx:124*(1+st.flat*.72+st.acid*.38+st.inflated*.36)*(1-st.vacuum*.6),h:Math.max(28,151*(1-st.flat*.74-st.acid*.48+st.inflated*.38)*(1-st.vacuum*.5))}}
function initNodes(){const {rx,h}=dimensions();nodes=Array.from({length:38},(_,i)=>{const a=i/38*TAU;const x=CX+bodyX+Math.sin(a)*rx*(.87-.13*Math.cos(a)),y=FLOOR+bodyY-h/2-Math.cos(a)*h/2;return{x,y,vx:0,vy:0,a}})}
function burst(x,y,n,color,type='drop'){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*155,vy:-20-Math.random()*145,r:2+Math.random()*5,life:.7+Math.random()*1.3,born:time,color,type});if(particles.length>180)particles.splice(0,particles.length-180)}
function squish(x,y,power=130){for(const n of nodes){const dx=n.x-x,dy=n.y-y,d=Math.hypot(dx,dy)+15,f=Math.exp(-d/100);n.vx+=dx/d*power*f;n.vy+=dy/d*power*f}expression='surprise';expressionUntil=time+.7}
function split(count=3,icy=false){const center=CX+bodyX;pieces=Array.from({length:count},(_,i)=>({x:center+(i-(count-1)/2)*35,y:FLOOR-55-i*8,vx:(i-(count-1)/2)*65,vy:-80-Math.random()*60,r:clamp(66/Math.sqrt(count),19,45),born:time,ice:icy}));expression='surprise';expressionUntil=time+1.5;burst(center,FLOOR-70,15,icy?'#cce8ee':'#b98b6d')}
function mergePieces(){pieces=[];st.flat=.35;st.vacuum=0;initNodes();squish(CX+bodyX,FLOOR-80,70);burst(CX+bodyX,FLOOR-65,10,'#c9a487','bubble')}
function explode(){const x=CX+bodyX,y=FLOOR+bodyY-dimensions().h*.52;blastAt=time;shake=reduced.matches?0:13;split(12,st.frozen>.3);pieces.forEach((p,i)=>{const a=i/12*TAU;p.x=x+Math.cos(a)*24;p.y=y+Math.sin(a)*18;p.vx=Math.cos(a)*(280+Math.random()*280);p.vy=Math.sin(a)*260-180;p.r=19+Math.random()*13;p.spin=(Math.random()-.5)*9;p.angle=0;p.squash=0});for(let i=0;i<65;i++){const a=Math.random()*TAU;particles.push({x,y,vx:Math.cos(a)*(140+Math.random()*500),vy:Math.sin(a)*400-120,r:2+Math.random()*8,life:1.5+Math.random()*2,born:time,color:st.paint?colors[paintIndex]:'#a97545',type:'drop'})}for(let i=0;i<9;i++)stamps.push({x:clamp(x+(Math.random()-.5)*650,20,W/S-20),y:FLOOR-30-Math.random()*170,color:st.paint?colors[paintIndex]:'#a97545',born:time});stamps=stamps.slice(-14);st.inflated=0;bodyY=bodyVY=0;reportCombo('Mucho ego. Poca resistencia.');$('#hint').textContent='reventó. puedes seguir con los pedazos.';tone('boom')}
function tone(kind='plop'){if(!sound||modal||document.hidden||!hostVisible)return;try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.19;master.connect(audio.destination)}audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=kind==='boom'?'sawtooth':kind==='zap'?'triangle':'sine';o.frequency.setValueAtTime(kind==='boom'?95:kind==='ice'?740:kind==='zap'?210:210+Math.random()*100,t);o.frequency.exponentialRampToValueAtTime(kind==='ice'?390:65,t+.19);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}catch{sound=false;$('#sound').setAttribute('aria-pressed','false')}}
function active(id){return id==='ice'?st.frozen>.3:id==='fire'?st.hot>.3:id==='water'?st.wet>.3:id==='inflate'?st.inflated>.3:id==='glue'?st.glue>.3:id==='metal'?st.metal>.3:id==='paint'?st.paint>.1:id==='press'?st.waffle>.3:id==='acid'?st.acid>.3:id==='tornado'?st.spin>.3:latest===id}
function reportCombo(name){$('#combo-badge').textContent='✧ '+name;$('#combo-badge').classList.add('show');badgeUntil=time+3;$('#status').textContent='Combinación descubierta: '+name;}
function use(id,x=CX+bodyX,y=FLOOR-85,continuous=false){if(modal)return;const combo=PAIRS.find(p=>p[1]===id&&active(p[0]));if(combo&&!continuous)reportCombo(combo[2]);effect={id,born:time,x,y};expression='surprise';expressionUntil=time+1.1;
 switch(id){
 case 'hand':squish(x,y,110);break;
 case 'box':shake=reduced.matches?0:5;bodyVY=-110;squish(x,y,780);bodyV+=(x<CX+bodyX?1:-1)*150;if(st.paint){stamps.push({x:clamp(x<CX?W/S-35:35,25,W/S-25),y:FLOOR-80,color:colors[paintIndex],born:time});if(stamps.length>4)stamps.shift()}if(pieces.length)pieces.forEach(p=>{p.vx+=(x<p.x?1:-1)*140;p.vy-=100});break;
 case 'bat':shake=reduced.matches?0:7;if(st.frozen>.3){split(5,true);st.crack=1}else{bodyV=430;bodyVY=-230;squish(x,y,760);pieces.forEach(p=>{p.vx=270;p.vy=-130})}break;
 case 'hammer':shake=reduced.matches?0:8;st.flat=Math.min(1,st.flat+.7);squish(CX+bodyX,FLOOR-140,450);pieces.forEach(p=>{p.vy=150});break;
 case 'press':st.flat=1;st.waffle=1;squish(CX+bodyX,FLOOR-160,430);break;
 case 'cut':if(pieces.length){if(pieces.length<8)split(Math.min(8,pieces.length+2),st.frozen>.3)}else split(3,st.frozen>.3);break;

 if(['cut','inflate','glue','paint','ice','water','metal','acid'].includes(effect.id)){ctx.font='30px "Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.globalAlpha*=clamp(1.4-age);ctx.fillText(TOOLS.find(a=>a.id===effect.id).icon,x,y-48-age*10)}ctx.restore()}
function draw(){ctx.setTransform(S*dpr,0,0,S*dpr,0,0);ctx.clearRect(0,0,W/S,H/S);if(shake)ctx.translate(Math.sin(time*97)*shake,Math.cos(time*83)*shake*.65);const width=W/S,height=H/S;const desk=ctx.createLinearGradient(0,FLOOR-20,0,height);desk.addColorStop(0,'#1a252d00');desk.addColorStop(.16,'#18212bed');desk.addColorStop(1,'#10171f');ctx.fillStyle=desk;ctx.fillRect(0,FLOOR+8,width,height-FLOOR);line([[0,FLOOR+8],[width,FLOOR+8]],'#93bbc333',1);oval(CX,FLOOR+12,155,23,'#00000040');oval(CX,FLOOR+8,133,16,'#00000033');for(const stamp of stamps){ctx.save();ctx.globalAlpha=.7*(1-(time-stamp.born)/25);oval(stamp.x,stamp.y,30,46,stamp.color);for(let i=0;i<7;i++)oval(stamp.x+Math.sin(i*7)*35,stamp.y+Math.cos(i*3)*45,4,5,stamp.color);ctx.restore()}
 if(pieces.length)drawPieces();else drawSlime();drawEffects();for(const p of particles){const a=clamp(1-(time-p.born)/p.life);ctx.save();ctx.globalAlpha=a;if(p.type==='steam'){oval(p.x,p.y,p.r*3,p.r*2,'#f7f7ef');}else if(p.type==='metal'){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}else if(p.type==='bubble'){ctx.strokeStyle=p.color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.1-a*.3),0,TAU);ctx.stroke()}else oval(p.x,p.y,p.r,p.r*(p.type==='drop'?1.3:1),p.color);ctx.restore()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}function hit(x,y){if(pieces.length)return pieces.some(p=>Math.hypot(x-p.x,y-p.y)<p.r+24);return x>Math.min(...nodes.map(n=>n.x))-20&&x<Math.max(...nodes.map(n=>n.x))+20&&y>Math.min(...nodes.map(n=>n.y))-20&&y<FLOOR+25}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||modal)return;const p=point(e);if(!hit(p.x,p.y))return;canvas.setPointerCapture(e.pointerId);pointer={...p,startX:p.x,startY:p.y,born:time};if(selected==='hand'){if(pieces.length)pointer.piece=pieces.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);else{let best=0;nodes.forEach((n,i)=>{if(Math.hypot(n.x-p.x,n.y-p.y)<Math.hypot(nodes[best].x-p.x,nodes[best].y-p.y))best=i});pointer.node=best}squish(p.x,p.y,95);tone()}else use(selected,p.x,p.y);run()});canvas.addEventListener('pointermove',e=>{if(!pointer)return;const p=point(e);pointer.throwVX=clamp((p.x-pointer.x)/Math.max(.016,time-(pointer.movedAt||time-.016)),-750,750);pointer.throwVY=clamp((p.y-pointer.y)/Math.max(.016,time-(pointer.movedAt||time-.016)),-650,650);pointer.movedAt=time;pointer.x=clamp(p.x,10,W/S-10);pointer.y=clamp(p.y,160,FLOOR+5);if(pointer.piece){pointer.piece.x=pointer.x;pointer.piece.y=pointer.y}if(selected==='hand'&&pointer.node!==undefined&&Math.hypot(pointer.x-pointer.startX,pointer.y-pointer.startY)>290&&time-pointer.born>.65){split(2,st.frozen>.3);pointer.piece=pieces[0];delete pointer.node;reportCombo('Un slime, dos problemas')}if(selected==='magnet'){gripX=pointer.x;gripY=pointer.y}if(reduced.matches)draw()});function release(){if(pointer?.node!==undefined){bodyV+=(pointer.throwVX||0)*.26;bodyVY+=(pointer.throwVY||0)*.25}if(pointer?.piece){pointer.piece.vx=pointer.throwVX||0;pointer.piece.vy=pointer.throwVY||-60}pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
function select(id,clearQueue=true){selected=id;const t=TOOLS.find(a=>a.id===id);$('#selection').replaceChildren();const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=t.icon;const label=document.createElement('span');label.textContent=t.name;$('#selection').append(glyph,label);document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));document.querySelectorAll('.group').forEach((b,i)=>b.setAttribute('aria-pressed',String(t.group===i)));$('#hint').textContent=id==='hand'?'arrastra, estira y suelta.':id==='inflate'?'mantén pulsado el slime. a ver cuánto aguanta.':'toca al slime con '+t.name.toLowerCase();if(clearQueue){comboQueue=[];queueIndex=0;$('#queue').replaceChildren()}const btn=document.querySelector('.tool[data-id="'+id+'"]');if(btn){const tray=$('#tray');const left=btn.offsetLeft-tray.clientWidth/2+btn.clientWidth/2;tray.scrollTo({left,behavior:reduced.matches?'instant':'smooth'})}}
for(let i=0;i<TOOLS.length;i++){const t=TOOLS[i],b=document.createElement('button');b.className='tool';b.dataset.id=t.id;b.dataset.n=i+1;b.setAttribute('aria-label',t.name);b.setAttribute('aria-pressed',String(i===0));b.title=t.name;b.style.setProperty('--tone',tones[t.group]);b.textContent=t.icon;const caption=document.createElement('span');caption.className='tool-name';caption.textContent=t.name;b.append(caption);b.addEventListener('click',()=>select(t.id));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:19))%20;document.querySelectorAll('.tool')[next].focus()}});$('#tray').append(b)}['Impacto','Reacciones','Fuerzas','Caos'].forEach((name,i)=>{const b=document.createElement('button');b.className='group';b.textContent=name;b.setAttribute('aria-pressed',String(i===0));b.addEventListener('click',()=>{const t=document.querySelectorAll('.tool')[i*5];$('#tray').scrollTo({left:t.offsetLeft-17,behavior:reduced.matches?'instant':'smooth'});document.querySelectorAll('.group').forEach((g,j)=>g.setAttribute('aria-pressed',String(i===j)))});$('.groups').append(b)});
function renderQueue(){$('#queue').replaceChildren();comboQueue.forEach((id,i)=>{const s=document.createElement('span');s.className=i<queueIndex?'done':'';s.textContent=TOOLS.find(t=>t.id===id).icon+(i<queueIndex?' ✓':'');$('#queue').append(s);if(i===0){const a=document.createElement('b');a.textContent='→';$('#queue').append(a)}})}
const wc=$('#wheel').getContext('2d');let wheelAngle=0,spinFrame=0,spinToken=0,spinning=false,lastWheelFocus=null;
function drawWheel(angle){wc.clearRect(0,0,620,620);wc.save();wc.translate(310,310);wc.rotate(angle);for(let i=0;i<20;i++){const a=i*TAU/20;wc.beginPath();wc.moveTo(0,0);wc.arc(0,0,288,a,a+TAU/20);wc.closePath();wc.fillStyle=i%2?tones[TOOLS[i].group]:'#faf0e5';wc.fill();wc.strokeStyle='#fffaf3';wc.lineWidth=2;wc.stroke();wc.save();wc.rotate(a+TAU/40);wc.translate(235,0);wc.rotate(Math.PI/2);wc.font='29px "Segoe UI Emoji",sans-serif';wc.textAlign='center';wc.textBaseline='middle';wc.fillStyle='#725c72';wc.fillText(TOOLS[i].icon,0,0);wc.restore()}wc.restore();wc.beginPath();wc.arc(310,310,55,0,TAU);wc.fillStyle='#fbf5eb';wc.fill();wc.strokeStyle='#d6c3da';wc.lineWidth=3;wc.stroke();wc.fillStyle='#ab86a6';wc.textAlign='center';wc.textBaseline='middle';wc.font='32px Georgia';wc.fillText('✧',310,312)}
function openWheel(){modal=true;lastWheelFocus=document.activeElement;$('#overlay').hidden=false;$('#dock').inert=true;$('#top-controls').inert=true;audio?.suspend();drawWheel(wheelAngle);$('#spin').focus();prev=0}
function closeWheel(){spinToken++;cancelAnimationFrame(spinFrame);spinFrame=0;spinning=false;$('#spin').disabled=$('#combo-spin').disabled=false;$('#overlay').hidden=true;$('#dock').inert=false;$('#top-controls').inert=false;modal=false;lastWheelFocus?.focus();run()}
function spin(pairMode){if(spinning)return;spinning=true;const token=++spinToken,pair=pairMode?PAIRS[Math.floor(Math.random()*PAIRS.length)]:null,index=pair?TOOLS.findIndex(t=>t.id===pair[0]):Math.floor(Math.random()*20);const base=wheelAngle,desired=-Math.PI/2-(index+.5)*TAU/20,delta=((desired-base)%TAU+TAU)%TAU+TAU*4,end=base+delta,start=performance.now(),duration=reduced.matches?0:2800;$('#spin').disabled=$('#combo-spin').disabled=true;$('#roulette-result').textContent='';function finishSpin(){if(token!==spinToken)return;wheelAngle=end%TAU;drawWheel(wheelAngle);select(TOOLS[index].id);if(pair){comboQueue=pair.slice(0,2);queueIndex=0;renderQueue();$('#roulette-result').textContent=TOOLS[index].name+' + '+TOOLS.find(t=>t.id===pair[1]).name}else $('#roulette-result').textContent=TOOLS[index].name;spinning=false;$('#spin').disabled=$('#combo-spin').disabled=false;setTimeout(()=>{if(token===spinToken&&modal)closeWheel()},900)}function turn(now){if(token!==spinToken)return;const t=duration?clamp((now-start)/duration):1;wheelAngle=base+delta*(1-Math.pow(1-t,4));drawWheel(wheelAngle);if(t<1)spinFrame=requestAnimationFrame(turn);else finishSpin()}spinFrame=requestAnimationFrame(turn)}
$('#open-wheel').addEventListener('click',openWheel);$('#close-wheel').addEventListener('click',closeWheel);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeWheel()});$('#spin').addEventListener('click',()=>spin(false));$('#combo-spin').addEventListener('click',()=>spin(true));document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeWheel()}if(e.key==='Tab'){const b=[$('#close-wheel'),$('#spin'),$('#combo-spin')].filter(b=>!b.disabled),i=b.indexOf(document.activeElement);e.preventDefault();b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus()}});
$('#reset').addEventListener('click',reset);$('#sound').addEventListener('click',()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',String(sound));$('#sound').setAttribute('aria-label',sound?'Silenciar sonidos':'Activar sonidos');if(sound)tone();else audio?.suspend()});
function resize(){const oldS=S,oldCX=CX,oldFloor=FLOOR;W=world.clientWidth;H=world.clientHeight;S=Math.min(W/470,H/820,1.15);CX=W/S/2;FLOOR=H*.625/S;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);if(nodes.length){const dx=CX-oldCX,dy=FLOOR-oldFloor;for(const n of nodes){n.x+=dx;n.y+=dy}for(const p of pieces){p.x=clamp(p.x+dx,p.r,W/S-p.r);p.y+=dy}}else initNodes();draw()}
function frame(now){raf=0;if(document.hidden||!hostVisible||modal){prev=0;return}const dt=prev?Math.min((now-prev)/1000,.04):0;prev=now;time+=dt;update(dt);if(now-lastRender>1000/40){draw();lastRender=now}raf=requestAnimationFrame(frame)}function run(){if(!raf&&!document.hidden&&hostVisible&&!modal){prev=0;raf=requestAnimationFrame(frame)}}function visibility(){if(document.hidden||!hostVisible){cancelAnimationFrame(raf);raf=0;prev=0;release();audio?.suspend()}else run()}document.addEventListener('visibilitychange',visibility);addEventListener('resize',resize,{passive:true});addEventListener('blanca:state',e=>{hostVisible=e.detail?.visible!==false;if(e.detail?.muted){sound=false;$('#sound').setAttribute('aria-pressed','false');$('#sound').setAttribute('aria-label','Activar sonidos')}visibility()});if(window.__BLANCA_WORLD__)hostVisible=window.__BLANCA_WORLD__.visible!==false;select('hand');resize();drawWheel(0);run();
function syncSound(profile){sound=profile?.muted===false;$('#sound').setAttribute('aria-pressed',String(sound));$('#sound').setAttribute('aria-label',sound?'Silenciar sonidos':'Activar sonidos');if(!sound)audio?.suspend()}
