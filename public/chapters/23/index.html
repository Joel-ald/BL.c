<script>
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),checks=[...document.querySelectorAll('input')],nudge=document.querySelector('#nudge'),oops=document.querySelector('#oops'),finale=document.querySelector('#finale');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelector('h2').innerHTML='<span>feliz</span> <span>cumpleaños</span><em>Blanquitaaaa</em>';

const cakeCaption=document.createElement('div');cakeCaption.id='cake-caption';cakeCaption.textContent='¡¿QUIÉN LANZÓ EL PASTEL?!';document.body.append(cakeCaption);
function flyCake(elapsed){
  const t=elapsed-21;
  if(t<0){cakeFlight.style.opacity=0;cakeCaption.style.opacity=0;return}
  if(reduced){cakeFlight.style.opacity=1;cakeFlight.style.transform=`translate(${W-155}px,${H-165}px) scale(.6)`;return}
  const cycle=Math.floor(t/12),phase=t%12,duration=3.6;
  cakeCaption.textContent=['wiiii','allá voyyy','permiso jsjs','última vueltaaaa'][cycle]||'';
  if(cycle>=4){cakeFlight.style.opacity=0;cakeCaption.style.opacity=0;return}
  if(phase>duration){cakeFlight.style.opacity=0;cakeCaption.style.opacity=phase<5?'1':'0';return}
  const p=phase/duration,reverse=cycle%2===1;
  const x=reverse?W+170-p*(W+370):-190+p*(W+370);
  const y=H*.77-Math.sin(p*Math.PI)*H*.16;
  cakeFlight.style.opacity=1;cakeFlight.style.transform=`translate(${x}px,${y-80}px) rotate(${(reverse?-1:1)*(p*470-35)}deg)`;
  cakeCaption.style.opacity=p>.38?'1':'0';
}
let host=window.__BLANCA_WORLD__||{visible:true,muted:true,tier:'light',pixelRatio:1},W=0,H=0,time=0,last=0,start=null,nextRocket=0,nudgeUntil=0,failed=false,particles=[],rockets=[],audio;
const colors=['#ffc2d1','#ffdc83','#8fe5cf','#a9c9ff','#ff977f'];
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,host.pixelRatio||1,1.5);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
resize();addEventListener('resize',resize);addEventListener('blanca:state',e=>{host=e.detail;resize()});
function chime(){if(host.muted||!host.visible)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const t=audio.currentTime;[523,659,784].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.025,t+i*.09+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.45);o.connect(g);g.connect(audio.destination);o.start(t+i*.09);o.stop(t+i*.09+.5)})}catch{}}
checks.forEach((check,i)=>check.addEventListener('change',()=>{if(start!==null)return;if(checks.every(c=>c.checked)){nudge.hidden=true;start=time;checks.forEach(c=>c.disabled=true);document.body.classList.add('depart');document.querySelector('#paper-scene').inert=true;chime()}else if(i===5&&check.checked){nudge.hidden=false;nudgeUntil=time+3.8}}));
function launch(dud=false){rockets.push({x:dud?W*.48:W*(.12+Math.random()*.76),y:H+10,top:H*(.12+Math.random()*.35),v:H*(.35+Math.random()*.15),dud,color:colors[Math.floor(Math.random()*colors.length)]})}
function burst(r){const n=host.tier==='light'?36:70,max=host.tier==='light'?180:420;for(let i=0;i<n&&particles.length<max;i++){const a=Math.PI*2*i/n,s=40+Math.random()*105;particles.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.6+Math.random(),age:0,color:r.color})}}
function draw(dt,elapsed){ctx.clearRect(0,0,W,H);if(start===null)return;ctx.fillStyle='#050b16';ctx.fillRect(0,0,W,H);
for(let i=0;i<35;i++){ctx.globalAlpha=.2+Math.sin(i+time*.7)*.12;ctx.fillStyle='#e5e8eb';ctx.fillRect((i*137.3)%W,(i*73.7)%H,1.5,1.5)}ctx.globalAlpha=1;
if(!reduced){for(const r of rockets){
if(r.dud){
 const age=elapsed-1.5,p=Math.min(age/1.5,1);r.x=W*.5+Math.sin(age*13)*Math.min(age*4,10);r.y=H-(H*.69)*Math.sin(p*Math.PI/2);
 if(age>2.1){r.y=H*.31+(age-2.1)*(age-2.1)*H*.55;r.x+=Math.sin(age*8)*22}
 ctx.save();ctx.translate(r.x,r.y);ctx.rotate(age>2.1?(age-2.1)*7:Math.sin(age*13)*.15);
 ctx.fillStyle='#fff0d5';ctx.fillRect(-7,-7,14,25);ctx.fillStyle='#f38ca2';ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(0,-22);ctx.lineTo(9,-7);ctx.fill();ctx.fillStyle='#313d56';ctx.fillRect(-4,0,2,3);ctx.fillRect(2,0,2,3);ctx.beginPath();ctx.arc(0,9,3,0,Math.PI*2);ctx.strokeStyle='#313d56';ctx.stroke();
 if(age<1.65){ctx.fillStyle='#ffd578';ctx.beginPath();ctx.moveTo(-4,18);ctx.lineTo(0,35+Math.sin(age*40)*7);ctx.lineTo(4,18);ctx.fill()}
 ctx.restore();if(r.y>H+70)r.dead=true;continue;
}
r.y-=r.v*dt;ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x,r.y+24);ctx.stroke();if(r.y<=r.top){burst(r);r.dead=true}}rockets=rockets.filter(r=>!r.dead);
for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=35*dt;p.vx*=Math.pow(.6,dt);ctx.globalAlpha=Math.max(0,1-p.age/p.life);ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.025,p.y-p.vy*.025);ctx.stroke()}particles=particles.filter(p=>p.age<p.life);ctx.globalAlpha=1;}
if(elapsed>18){const count=host.tier==='light'?24:48;for(let i=0;i<count;i++){const speed=reduced?0:time;const x=((i+.5)/count*W+Math.sin(speed*.6+i)*16+W)%W,y=((i*.61803398875%1)*(H+40)+speed*(22+i%5*4))%(H+40)-20;ctx.save();ctx.translate(x,y);ctx.rotate(reduced?i:time+i);ctx.fillStyle=colors[i%5];ctx.fillRect(-2,-5,4,10);ctx.restore()}for(let i=0;i<4;i++){const x=i%2?W-22:22,y=reduced?H*.3+i*90:H-((time*22+i*170)%(H+150));ctx.fillStyle=colors[i%5];ctx.beginPath();ctx.ellipse(x,y,18,24,Math.sin(time*.6+i)*.1,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d3d9d777';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+24);ctx.bezierCurveTo(x-12,y+48,x+12,y+65,x,y+90);ctx.stroke()}}
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000||0,.05);last=now;if(document.hidden||host.visible===false)return;time+=dt;if(!nudge.hidden&&time>nudgeUntil)nudge.hidden=true;const e=start===null?0:time-start;flyCake(e);partyStory(e);
if(start!==null){if(e>1.5&&!failed){failed=true;if(!reduced)launch(true)}if(e>4&&e<17)oops.classList.add('show');else oops.classList.remove('show');if(e>17&&time>nextRocket){nextRocket=time+(host.tier==='light'?.8:.5);if(!reduced)launch()}if(e>18&&!document.body.classList.contains('party')){document.body.classList.add('party');finale.setAttribute('aria-hidden','false');document.querySelector('h2').tabIndex=-1;document.querySelector('h2').focus({preventScroll:true});chime()}}draw(dt,e)}requestAnimationFrame(frame);

#oops{padding:24px}#oops small{max-width:320px}
#intruder{top:27%}.balloon-quote{display:none}
#finale{padding-bottom:110px}
@media(max-height:690px){#walking-rocket{bottom:75px}#intruder{top:24%}}
</style>
<button id="intruder" type="button" aria-label="Apartar el globo entrometido" tabindex="-1"><span class="balloon-quote">yo también quería salir en la foto</span><i class="balloon-string" aria-hidden="true"></i></button>
<div id="walking-rocket" aria-hidden="true"><span>yo mejor por las escaleras</span></div>
<dialog id="gag-dialog" aria-label="Una sorpresa para ti"><div id="gag-content" aria-live="polite"></div><button id="close-gag" type="button">bueno jsjs</button></dialog>
<style>
.tiny-heart{position:fixed;z-index:12;left:50%;top:55%;width:14px;height:14px;background:var(--heart);transform:rotate(45deg);pointer-events:none;animation:heart-flight 1.8s ease-out both}.tiny-heart:before,.tiny-heart:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:inherit}.tiny-heart:before{left:-7px}.tiny-heart:after{top:-7px}@keyframes heart-flight{from{opacity:1;transform:translate(0,0) rotate(45deg) scale(.2)}to{opacity:0;transform:translate(var(--hx),var(--hy)) rotate(65deg) scale(1)}}
@media(prefers-reduced-motion:reduce){.tiny-heart{display:none}#walking-rocket.walk:after{animation:none}#intruder{transition:none}}
</style>
<script>
const wish=document.querySelector('.wish'),toys=document.querySelector('#playthings'),intruder=document.querySelector('#intruder'),walker=document.querySelector('#walking-rocket'),dialog=document.querySelector('#gag-dialog'),gagContent=document.querySelector('#gag-content');
let balloonGone=false,balloonRemovedAt=null,hugStart=null,hugValue=-1,returnButton=null;
function partyStory(e){
 let line=e<18?'':e<27?'que nunca te falten motivos para sonreír':e<34?'esta fiesta está un poquito fuera de control jsjs':'quita ese globo\nno me deja concentrarme para decirte algo';
 const after=balloonRemovedAt===null?null:time-balloonRemovedAt;
 if(after!==null)line=after<7?'se me olvidó qué iba a decirte\nen fin feliz cumpleaños jsjs':'';
 if(wish.textContent!==line)wish.textContent=line;
 wish.style.visibility=line?'visible':'hidden';
 if(e>4&&e<8)oops.innerHTML='bueno ese era de prueba<small>no lo juzgues está nervioso</small>';
 else if(e>=8&&e<14)oops.innerHTML='se cambió de transporte<small>dice que así es más seguro</small>';
 else if(e>=14&&e<17)oops.innerHTML='AHORA SÍ<small>los demás sí hicieron el ensayo</small>';
 const playing=after!==null&&after>=8;document.body.classList.toggle('toys',playing);toys.inert=!playing;
 const walk=e>7&&e<14;walker.style.opacity=walk?'1':'0';walker.classList.toggle('walk',walk&&!reduced);
 if(walk){const p=(e-7)/7;walker.style.left=(reduced?W*.4:W*.16+p*W*.58)+'px';walker.style.transform=`translateY(${reduced?0:-Math.floor(p*6)*9-Math.abs(Math.sin(p*30))*4}px) scale(1.7)`}
 const balloon=e>=34&&!balloonGone;intruder.classList.toggle('show',balloon);intruder.tabIndex=balloon?0:-1;intruder.style.transform=balloon?'rotate(8deg)':e>=34?'translate(160px,-550px) rotate(40deg)':'translate(-180px,80px) rotate(-18deg)';
 if(hugStart!==null&&dialog.open){const age=time-hugStart,value=Math.min(99,Math.floor(age/4.5*99));if(value!==hugValue){hugValue=value;document.querySelector('#hug-meter').value=value;document.querySelector('#hug-number').textContent=value+' %'}if(age>6){document.querySelector('#hug-line').textContent='por qué tocaste...\nse eliminó tu regalito :c';hugStart=null}}
}
function showerHearts(){if(reduced)return;document.querySelectorAll('.tiny-heart').forEach(el=>el.remove());for(let i=0;i<(host.tier==='light'?12:22);i++){const heart=document.createElement('i');heart.className='tiny-heart';heart.setAttribute('aria-hidden','true');heart.style.setProperty('--heart',colors[i%colors.length]);heart.style.setProperty('--hx',((Math.random()-.5)*Math.min(W,600))+'px');heart.style.setProperty('--hy',(-100-Math.random()*300)+'px');heart.addEventListener('animationend',()=>heart.remove(),{once:true});document.body.append(heart)}}
function showGag(kind,button){returnButton=button;hugValue=-1;
 gagContent.innerHTML='<p id="hug-line">cargando tu regalito...</p><progress id="hug-meter" aria-label="Cargando tu regalito" max="100" value="0"></progress><p id="hug-number">0 %</p>';if(!dialog.open)dialog.showModal();hugStart=time;chime();
}
toys.addEventListener('click',event=>{const button=event.target.closest('[data-gag]');if(button)showGag(button.dataset.gag,button)});
intruder.addEventListener('click',()=>{balloonGone=true;balloonRemovedAt=time;intruder.classList.remove('show');intruder.tabIndex=-1;intruder.style.transform='translate(160px,-550px) rotate(40deg)';document.querySelector('h2').focus({preventScroll:true});chime()});
function closeGag(){dialog.close();hugStart=null;returnButton?.focus({preventScroll:true})}
document.querySelector('#close-gag').addEventListener('click',closeGag);
dialog.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeGag()}});
document.querySelector('#again').hidden=false;
document.querySelector('#again').addEventListener('click',()=>{
 balloonGone=false;balloonRemovedAt=null;hugStart=null;hugValue=-1;nextRocket=0;
 if(dialog.open)dialog.close();
 document.body.classList.remove('toys');toys.inert=true;
 intruder.classList.remove('show');intruder.tabIndex=-1;walker.style.opacity=0;
 cakeFlight.style.opacity=0;cakeCaption.style.opacity=0;
 nudge.querySelector('span:last-child').textContent='otra vez? ya te gustó que te celebren eh jsjs';
 nudge.hidden=false;nudgeUntil=time+4.5;
});
checks[5].addEventListener('change',()=>{if(checks[5].checked&&!checks.every(c=>c.checked))nudge.querySelector('span:last-child').innerHTML='Debes tachar todo jsjs.<br>Aquí no se vale hacer trampa.'});
</script></body></html>
