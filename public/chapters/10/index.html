<style>
*{box-sizing:border-box}body{margin:0;background:#263950;color:#eef5ec;font-family:Georgia,serif}.world{height:100svh;min-height:650px;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 62%,#719ba033,transparent 48%),linear-gradient(160deg,#25324c,#344b62 62%,#4e6a79)}.room{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.23}.window{position:absolute;width:190px;height:290px;right:-40px;top:18%;border:10px solid #9fb9c24d;border-radius:100px 100px 0 0;box-shadow:inset 0 0 80px #a5d4de26;filter:blur(4px)}.window:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#a0bfc33d 49%,#a0bfc33d 52%,transparent 53%),linear-gradient(transparent 48%,#a0bfc333 49%,#a0bfc333 52%,transparent 53%)}.shelf{position:absolute;left:-20px;top:44%;width:130px;height:8px;border-radius:8px;background:#9db4b5;filter:blur(5px)}.bottle{position:absolute;left:28px;top:calc(44% - 91px);height:91px;width:44px;border-radius:14px 14px 9px 9px;background:linear-gradient(#afcac022,#76b0bd99);filter:blur(4px)}.bottle:before{content:'';position:absolute;width:19px;height:27px;top:-18px;left:12px;background:#97c2c344;border-radius:6px}.table{position:absolute;left:0;right:0;bottom:0;height:23%;background:linear-gradient(#71949b18,#78989b0a);border-top:1px solid #aec6c51a}.stage{position:absolute;inset:0;margin:auto;width:min(100%,650px);height:100%;overflow:visible}.letter{font:27px Georgia,serif;fill:#f8f1de;text-anchor:middle;dominant-baseline:central;pointer-events:none}.warm-light{transition:opacity .2s}.power{cursor:pointer;touch-action:manipulation;outline:none}.power:focus-visible{filter:drop-shadow(0 0 6px #f2d8a6)}.power:hover .power-ring{stroke:#fff1d1}.knit{stroke-linecap:round;stroke-linejoin:round}.controls{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:210px;height:32px;color:#c5d4d8}.controls svg{width:17px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}input[type=range]{appearance:none;width:100%;height:4px;background:#b5c8cf32;border-radius:10px;cursor:pointer;touch-action:pan-y}input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;background:#dbb3b7;border:3px solid #f0d5d1;border-radius:50%;box-shadow:0 2px 8px #15283a44}input[type=range]::-moz-range-thumb{width:13px;height:13px;background:#dbb3b7;border:3px solid #f0d5d1;border-radius:50%}input:focus-visible,button:focus-visible{outline:2px solid #f5dbae;outline-offset:7px}.again{position:absolute;bottom:4.4%;left:50%;transform:translateX(-50%);padding:10px 21px;border:1px solid #cbd8da38;border-radius:25px;background:#b9caca0b;color:#d2dee0;font:12px Georgia,serif;cursor:pointer}.again[hidden],.controls[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}@media(max-height:700px){.controls{bottom:3%}.again{bottom:2.5%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:500px){.stage{width:120%;left:-10%;right:auto;margin:0}.controls{bottom:8%}.again{bottom:7.5%}}
.again{padding:0;width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent}.controls{animation:controls-in .35s ease both}@keyframes controls-in{from{opacity:0}to{opacity:1}}
</style></head><body><main class="world" id="world"><div class="room" aria-hidden="true"><div class="window"></div><div class="shelf"></div><div class="bottle"></div></div><div class="table" aria-hidden="true"></div>
<svg class="stage" id="stage" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" aria-label="Un matraz azul sobre una pequeña placa de calor. Enciéndela para descubrir una frase."><defs>

<path d="M224 499Q207 529 216 558" fill="none" stroke="#effbfa" stroke-width="7" opacity=".12" stroke-linecap="round"/></g>

<g stroke="#d8eee888" stroke-width="2" stroke-linecap="round"><path d="M346 488h11m-6 20h14m-10 20h16m-16 20h16"/></g>
<g transform="translate(265 566) rotate(-8)"><path d="M-21-15Q0-21 22-15L23 15Q0 20-23 15Z" fill="#e9e1cb" stroke="#d1d5c7" stroke-width="1.5"/><text y="2" font-family="Georgia,serif" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#6a8493">H₂O</text></g>
<g id="goo" filter="url(#droplets)" fill="#709faf" aria-hidden="true"></g><g id="letters" aria-hidden="true"></g>
</svg><div class="controls" id="controls" hidden><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M10 3Q2 13 4 17a6 6 0 0 0 12 0Q18 13 10 3Z"/></svg><input id="heat" type="range" min="0" max="100" value="0" aria-label="Intensidad del calor"><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M11 2Q13 9 17 11Q21 21 10 22Q0 20 4 12Q4 16 7 16Q5 8 11 2Z"/></svg></div><button class="again" id="again" aria-label="Volver a empezar" title="Volver a empezar" hidden><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h10a6 6 0 0 1 0 12" transform="translate(1 -2)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><p class="sr-only" id="status" role="status" aria-live="polite">Enciende la placa o aumenta el calor para descubrir el mensaje.</p></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),svgNS='http://www.w3.org/2000/svg',reduced=matchMedia('(prefers-reduced-motion: reduce)'),world=$('#world'),slider=$('#heat'),power=$('#power'),phrase=['Que tu curiosidad','siga encontrando','nuevas respuestas.'];let clock=0,last=0,raf=0,lastDraw=0,target=0,heat=0,boilTime=0,revealAt=null,completeAt=null,finished=false,powered=false,hostVisible=true;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=clamp(t);return t*t*(3-2*t)},lerp=(a,b,t)=>a+(b-a)*t;function make(tag,attrs,parent){const el=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el}
const letters=[];let index=0;for(let line=0;line<phrase.length;line++){const row=phrase[line];let widths=[],total=0;for(const ch of row){const t=make('text',{class:'letter',x:0,y:0},$('#letters'));t.textContent=ch===' '?'\u00a0':ch;const w=t.getComputedTextLength();widths.push({el:t,ch,w});total+=w}let x=300-total/2;for(const item of widths){const finalX=x+item.w/2,finalY=166+line*51;item.el.setAttribute('opacity','0');const blob=make('ellipse',{cx:0,cy:0,rx:Math.max(8,item.w*.62),ry:18,opacity:0},$('#goo'));letters.push({...item,x:finalX,y:finalY,delay:index*.11,blob});if(item.ch!==' ')index++;x+=item.w}}
const bubbles=Array.from({length:28},()=>{const el=make('circle',{cx:300,cy:600,r:0,fill:'#e1f9f326',stroke:'#ddf7f19c','stroke-width':1},$('#bubbles'));return{el,x:230+Math.random()*140,y:610-Math.random()*85,r:1+Math.random()*3,phase:Math.random()*6.28,speed:13+Math.random()*22}});const vapour=Array.from({length:9},(_,i)=>({el:make('ellipse',{cx:300,cy:350,rx:7,ry:12,opacity:0},$('#vapour')),phase:i/9}));
function wave(y,t,amp,offset=0){let path='M185 '+y;for(let x=185;x<=415;x+=5){const wy=y+Math.sin(x*.038+t*2.1+offset)*amp+Math.sin(x*.07-t*1.5)*amp*.3;path+=' L'+x+' '+wy}return path}
function setHeat(value){target=powered?clamp(Number(value),0,100):0;slider.value=String(target);power.setAttribute('aria-pressed',String(powered));power.setAttribute('aria-label',powered?'Apagar la placa':'Calentar el matraz');$('#controls').hidden=!powered||finished;$('#status').textContent=powered?'Aumenta el calor para descubrir el mensaje.':'La placa está apagada.';if(reduced.matches){heat=target;if(powered&&heat>=92&&revealAt===null){revealAt=clock-30;completeAt=clock;finish()}render(0)}run()}
function togglePower(){if(finished){$('#again').click();return}powered=!powered;setHeat(powered?25:0)}
function finish(){if(finished)return;finished=true;power.setAttribute('aria-label','Volver a descubrir la reacción');$('#controls').hidden=true;$('#again').hidden=false;$('#status').textContent=phrase.join(' ');}
function render(dt){const rising=target>heat;heat+=(target-heat)*Math.min(1,dt*(rising?.7:.3));const intensity=clamp((heat-15)/65),boiling=clamp((heat-70)/25);if(powered&&heat>=92&&revealAt===null){boilTime+=dt;if(boilTime>1.4){revealAt=clock;$('#status').textContent='Las gotitas suben y forman un mensaje.'}}else if(revealAt===null){boilTime=0}if(revealAt!==null&&clock-revealAt>index*.11+2.8){if(completeAt===null)completeAt=clock;finish();if(clock-completeAt>1.5){target=23;slider.value='23'}}
const t=reduced.matches?0:clock,amp=reduced.matches?1:1+intensity*3.8,front=wave(518,t,amp),back=wave(511,t*.8,amp,1.7);$('#frontWave').setAttribute('d',front+' L415 635 L185 635Z');$('#waterClip').setAttribute('d',front+' L415 635 L185 635Z');$('#backWave').setAttribute('d',back+' L415 635 L185 635Z');$('#surfaceLine').setAttribute('d',front);$('#coil').setAttribute('stroke','rgb('+Math.round(lerp(143,245,intensity))+','+Math.round(lerp(168,176,intensity))+','+Math.round(lerp(184,161,intensity))+')');$('#heatGlowNode').setAttribute('opacity',String(intensity*.8));$('#warmWater').setAttribute('opacity',String(intensity*.3));$('#indicator').setAttribute('fill',target>0?'#f2d1ab':'#a8b8be');
for(const b of bubbles){if(!reduced.matches){b.y-=dt*b.speed*(.1+intensity*2.5);if(b.y<510){b.y=613;b.x=229+Math.random()*141}}const age=clamp((615-b.y)/100),radius=b.r*(.35+age*1.5)*intensity;b.el.setAttribute('cx',String(b.x+Math.sin(t*2+b.phase)*4*intensity));b.el.setAttribute('cy',String(b.y));b.el.setAttribute('r',String(radius));b.el.setAttribute('opacity',String(intensity*clamp((615-b.y)/12)))}
for(const v of vapour){const age=(t*.24+v.phase)%1;v.el.setAttribute('cx',String(300+Math.sin(age*8+v.phase*4)*age*16));v.el.setAttribute('cy',String(350-age*100));v.el.setAttribute('rx',String(4+age*13));v.el.setAttribute('ry',String(9+age*18));v.el.setAttribute('opacity',String(reduced.matches?0:Math.sin(age*Math.PI)*boiling*.1))}
for(const l of letters){if(revealAt===null){l.el.setAttribute('opacity','0');l.blob.setAttribute('opacity','0');continue}const age=clock-revealAt-l.delay;if(age<0){l.el.setAttribute('opacity','0');l.blob.setAttribute('opacity','0');continue}const p=reduced.matches?1:clamp(age/2.5),e=ease(p),q=1-e,x=q*q*q*300+3*q*q*e*300+3*q*e*e*l.x+e*e*e*l.x,y=q*q*q*354+3*q*q*e*293+3*q*e*e*(l.y+35)+e*e*e*l.y,arrive=ease((p-.72)/.28);l.blob.setAttribute('cx',String(x));l.blob.setAttribute('cy',String(y));l.blob.setAttribute('rx',String(lerp(4,Math.max(8,l.w*.64),arrive)));l.blob.setAttribute('ry',String(lerp(6,18,arrive)));l.blob.setAttribute('opacity',l.ch===' '?'0':String(Math.min(1,age*4)*.85));l.el.setAttribute('x',String(l.x));l.el.setAttribute('y',String(l.y+(1-arrive)*4));l.el.setAttribute('opacity',String(ease((p-.86)/.14)));}

}
function frame(now){raf=0;if(document.hidden||!hostVisible){last=0;return}const dt=last?Math.min((now-last)/1000,.08):0;last=now;clock+=dt;if(now-lastDraw>1000/30){render((now-lastDraw)/1000>.2?0:Math.min((now-lastDraw)/1000,.08));lastDraw=now}if(!reduced.matches||Math.abs(heat-target)>.1)raf=requestAnimationFrame(frame)}function run(){if(!raf&&!document.hidden&&hostVisible){last=0;lastDraw=performance.now();raf=requestAnimationFrame(frame)}}
power.addEventListener('click',togglePower);power.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();togglePower()}});slider.addEventListener('input',()=>setHeat(slider.value));$('#again').addEventListener('click',()=>{clock=0;heat=target=boilTime=0;revealAt=completeAt=null;finished=false;powered=false;$('#controls').hidden=true;$('#again').hidden=true;setHeat(0);render(0);power.focus()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else run()});addEventListener('blanca:state',e=>{hostVisible=e.detail?.visible!==false;if(!hostVisible){cancelAnimationFrame(raf);raf=0}else run()});reduced.addEventListener('change',()=>{if(reduced.matches&&revealAt!==null){revealAt=clock-20;finish()}render(0);run()});if(window.__BLANCA_WORLD__)hostVisible=window.__BLANCA_WORLD__.visible!==false;render(0);run();
})();
</script></body></html>
