<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9df"><title>Entre tinta y flores · Tres en raya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#344e61;font-family:Georgia,serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ab6470;outline-offset:5px}.scene{min-height:100svh;overflow:hidden;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;padding:48px 20px 28px;background:radial-gradient(ellipse at 70% 12%,#fffdf5 0,transparent 50%),radial-gradient(ellipse at 10% 80%,#c5d4d280,transparent 50%),#eee9df}.paper{position:absolute;inset:0;z-index:-1;opacity:.3;pointer-events:none}.landscape{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}.eyebrow{font:10px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#81928d}h1{font-weight:400;font-size:clamp(33px,6vw,51px);line-height:1.13;letter-spacing:-.05em;text-align:center;margin:18px 0 12px}h1 em{font-weight:400;color:#b47783}.subtitle{color:#7b8a87;font-size:14px;margin:0 0 23px;text-align:center}.players{display:flex;align-items:center;gap:30px;margin:0 0 22px;font:11px Arial,sans-serif;color:#718082}.player{display:flex;align-items:center;gap:8px}.token{font:25px Georgia;color:#385c77}.player:last-child .token{color:#aa7880}.dot{width:3px;height:3px;background:#aaa89b;border-radius:50%}.board-wrap{position:relative;width:min(350px,84vw);aspect-ratio:1}.grid-ink{position:absolute;inset:-2%;width:104%;height:104%;pointer-events:none;overflow:visible}.grid-ink path{fill:none;stroke:#607777;stroke-width:2.7;stroke-linecap:round;opacity:.57}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.cell{background:none;border:0;padding:17%;position:relative;border-radius:18%;touch-action:manipulation}.cell:not(:disabled):hover{background:#79999b0c}.cell:disabled{cursor:default}.cell svg{width:100%;height:100%;overflow:visible;display:block}.mark{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ink .65s cubic-bezier(.2,.65,.3,1) forwards;filter:url(#brush)}.x{stroke:#3c657e;stroke-width:9}.o{stroke:#b77f88;stroke-width:7}.second{animation-delay:.17s}.wash{fill:#537f8d0b;stroke:none}.winner{background:#ffffed66;transition:background .7s}.winner svg{animation:breathe 2.5s ease-in-out infinite}.winning-line{stroke:#b59667!important;stroke-width:3!important;opacity:.8!important;stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1s .25s ease forwards}.status{margin:23px 0 0;min-height:29px;font-size:19px;text-align:center;color:#526b72}.caption{height:20px;margin:5px 0 21px;color:#939a90;font-style:italic;font-size:13px;text-align:center}.restart{border:1px solid #879b9566;background:#faf7eb7a;color:#5e7779;padding:12px 28px;border-radius:50% 45% 48% 46% / 45% 50% 45% 50%;font-size:13px;transition:background .2s,transform .2s}.restart:hover{background:#fffaf0;transform:translateY(-2px)}.score{margin-top:23px;display:flex;gap:24px;font:10px Arial,sans-serif;letter-spacing:.07em;color:#89968d}.score b{display:block;text-align:center;font:18px Georgia;color:#698087;margin-top:6px}.seal{position:absolute;right:26px;top:27px;border:1px solid #b7817d;color:#b7817d;width:25px;height:32px;display:grid;place-items:center;font-size:16px;transform:rotate(6deg);opacity:.65}.petal{position:absolute;top:-30px;width:12px;height:7px;background:#dbaab17a;border-radius:80% 0 80% 0;pointer-events:none;animation:fall linear infinite;z-index:-1}.footer{margin-top:24px;font:italic 12px Georgia;color:#9ba396}.paused .petal{animation-play-state:paused}@keyframes ink{to{stroke-dashoffset:0}}@keyframes breathe{50%{transform:scale(1.04)}}@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translate3d(100px,920px,0) rotate(380deg);opacity:0}}@media(max-width:500px){.scene{padding-top:48px}.board-wrap{width:min(330px,84vw)}h1{font-size:38px}.subtitle{font-size:13px}.seal{right:17px;top:20px}.score{margin-top:21px}}@media(max-height:740px){.scene{padding-top:27px}h1{font-size:34px;margin-top:12px}.subtitle{margin-bottom:16px}.players{margin-bottom:14px}.board-wrap{width:min(290px,77vw)}.status{margin-top:18px}.caption{margin-bottom:13px}.footer{margin-top:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.mark,.winning-line{stroke-dashoffset:0}.petal{display:none}}
#win-line[hidden]{display:none}
.eyebrow,.subtitle,.players,.caption,.score,.footer,.seal{display:none}.scene{justify-content:center;gap:0;padding:42px 20px;min-height:100svh}h1{font:400 clamp(23px,4vw,31px)/1.5 Georgia,serif;letter-spacing:-.035em;margin:0 0 42px;max-width:480px;text-wrap:balance}h1 em{color:#b77e92}.board-wrap{background:#fffaf123;border-radius:34px}.status{font:italic 13px Georgia;color:#879b99;margin:23px 0 20px;min-height:17px}.restart{border-color:#b797a34d;background:#fff7f080;border-radius:24px;padding:12px 25px;color:#a17587}.cell:not(:disabled):hover{background:#eabcc922}.x{stroke:#6b91ae}.o{stroke:#ce9aaa}.grid-ink path{stroke:#96aaa6;opacity:.6}.petal{background:#e5abbc8c}.little-face{fill:#916b7e;animation:face-in .8s ease both;animation-delay:.55s}.little-face .cheek{fill:#e3a0af;opacity:.7}@keyframes face-in{from{opacity:0}to{opacity:1}}@media(max-width:500px){h1{font-size:24px;margin-bottom:36px}.scene{padding:32px 20px}.board-wrap{width:min(330px,84vw)}}@media(max-height:680px){h1{font-size:21px;margin-bottom:24px}.board-wrap{width:min(280px,76vw)}.scene{padding:24px 20px}}
</style></head><body><main class="scene" id="scene"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="brush" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="6" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/></filter></defs></svg>
<svg class="landscape" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="mist" x2="0" y2="1"><stop stop-color="#a9bebc" stop-opacity=".27"/><stop offset="1" stop-color="#b5c9bf" stop-opacity=".03"/></linearGradient></defs><circle cx="755" cy="180" r="88" fill="#e1b6ac" opacity=".16"/><path d="M-100 850 Q100 500 220 760 Q340 330 470 770 Q650 470 830 790 Q950 540 1100 830V1100H-100Z" fill="url(#mist)"/><g fill="none" stroke="#617d7c" stroke-linecap="round"><path d="M1030 50Q925 125 903 250Q875 355 1010 405M947 137Q826 98 771 31M912 211Q834 176 797 135M902 255Q1000 205 1020 143" stroke-width="6" opacity=".25"/><path d="M-40 1010Q60 905 80 806Q100 750 142 709M69 855L21 806M85 787L72 748M94 763L137 759" stroke-width="4" opacity=".22"/></g><g fill="#d6a4ae" opacity=".4"><circle cx="805" cy="137" r="13"/><circle cx="790" cy="133" r="10"/><circle cx="799" cy="120" r="10"/><circle cx="825" cy="178" r="10"/><circle cx="838" cy="185" r="12"/><circle cx="849" cy="174" r="9"/><circle cx="940" cy="133" r="12"/><circle cx="950" cy="116" r="10"/><circle cx="965" cy="128" r="12"/><circle cx="908" cy="259" r="11"/><circle cx="918" cy="269" r="9"/><circle cx="900" cy="271" r="9"/></g><g fill="#8fa7a0" opacity=".27"><ellipse cx="38" cy="827" rx="10" ry="27" transform="rotate(-40 38 827)"/><ellipse cx="108" cy="772" rx="10" ry="25" transform="rotate(50 108 772)"/></g></svg>
<svg class="paper" width="100%" height="100%" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" opacity=".18" filter="url(#grain)"/></svg>
<div class="seal" aria-hidden="true">✿</div><span class="eyebrow">Un ratito sin prisa</span><h1>También está bien hacer una pausa.<br><em>Jugar y disfrutar también son importantes.</em></h1><p class="subtitle">Tres en raya, una pincelada a la vez.</p><div class="players"><span class="player"><span class="token">×</span> Tú</span><span class="dot"></span><span class="player"><span class="token">○</span> La tinta</span></div>
<div class="board-wrap"><svg class="grid-ink" viewBox="0 0 300 300" aria-hidden="true"><g filter="url(#brush)"><path d="M102 9Q97 128 101 291M200 8Q204 149 199 289M10 101Q140 96 290 103M8 201Q168 205 292 199"/></g><path id="win-line" hidden/></svg><div class="board" id="board" role="group" aria-label="Tablero de tres en raya"></div></div>
<p class="status" id="status" role="status" aria-live="polite">Tu turno · ×</p><p class="caption" id="caption">Elige dónde dejar tu ×.</p><button class="restart" id="restart">Volver a jugar ↻</button><div class="score" aria-label="Marcador de esta sesión"><span>TÚ<b id="score-x">0</b></span><span>EMPATES<b id="score-d">0</b></span><span>LA TINTA<b id="score-o">0</b></span></div><div class="footer">Que lo bonito también sea jugar.</div></main>
<script>
(()=>{'use strict';
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]], board=document.querySelector('#board'),status=document.querySelector('#status'),caption=document.querySelector('#caption'),winLine=document.querySelector('#win-line');let cells=Array(9).fill(''),busy=false,over=false,timer=null,round=0;const scores={X:0,O:0,D:0};
function outcome(b){for(const line of lines)if(b[line[0]]&&line.every(i=>b[i]===b[line[0]]))return {winner:b[line[0]],line};return b.every(Boolean)?{winner:'D'}:null}
function minimax(b,turn,depth){const end=outcome(b);if(end)return end.winner==='O'?10-depth:end.winner==='X'?depth-10:0;let best=turn==='O'?-Infinity:Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=turn;const score=minimax(b,turn==='O'?'X':'O',depth+1);b[i]='';best=turn==='O'?Math.max(best,score):Math.min(best,score)}return best}
function chooseMove(b){let best=-Infinity,options=[];for(let i=0;i<9;i++)if(!b[i]){b[i]='O';const score=minimax(b,'X',0);b[i]='';if(score>best){best=score;options=[i]}else if(score===best)options.push(i)}return options[Math.floor(Math.random()*options.length)]}
function mark(symbol){return symbol==='X'?'<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mark x" pathLength="1" d="M21 17Q47 44 80 83"/><path class="mark x second" pathLength="1" d="M80 19Q48 53 20 80"/></svg>':'<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mark o" pathLength="1" d="M61 17C92 22 96 61 74 80C49 100 15 78 15 50C15 23 39 9 62 18C69 21 74 24 78 30"/><g class="little-face"><ellipse cx="39" cy="48" rx="2" ry="3"/><ellipse cx="61" cy="48" rx="2" ry="3"/><ellipse class="cheek" cx="32" cy="56" rx="5" ry="2.5"/><ellipse class="cheek" cx="68" cy="56" rx="5" ry="2.5"/><path d="M45 56Q50 62 55 56" fill="none" stroke="#916b7e" stroke-width="2" stroke-linecap="round"/></g></svg>'}
function sync(){buttons.forEach((b,i)=>{b.disabled=busy||over||!!cells[i];b.setAttribute('aria-label','Fila '+(Math.floor(i/3)+1)+', columna '+(i%3+1)+': '+(cells[i]||'vacía'))})}
function put(i,symbol){cells[i]=symbol;buttons[i].innerHTML=mark(symbol);sync()}
function finish(){const result=outcome(cells);if(!result)return false;over=true;busy=false;scores[result.winner]++;document.querySelector('#score-'+result.winner.toLowerCase()).textContent=scores[result.winner];status.textContent=result.winner==='X'?'Ganaste ♡':result.winner==='O'?'Esta vez ganó ○':'Empate ♡';caption.textContent=result.winner==='X'?'Tres pinceladas, una pequeña victoria.':result.winner==='O'?'Otra hoja, otra oportunidad.':'Un empate también puede ser bonito.';if(result.line){result.line.forEach(i=>buttons[i].classList.add('winner'));const a=result.line[0],b=result.line[2];winLine.setAttribute('d','M'+((a%3)*96.15+53.85)+' '+(Math.floor(a/3)*96.15+53.85)+'L'+((b%3)*96.15+53.85)+' '+(Math.floor(b/3)*96.15+53.85));winLine.setAttribute('pathLength','1');winLine.removeAttribute('hidden');winLine.setAttribute('class','winning-line')}sync();return true}
const buttons=Array.from({length:9},(_,i)=>{const button=document.createElement('button');button.className='cell';button.addEventListener('click',()=>{if(busy||over||cells[i])return;busy=true;put(i,'X');if(finish())return;status.textContent='Pensando… ○';caption.textContent='';const current=round;timer=setTimeout(()=>{if(current!==round)return;const move=chooseMove(cells.slice());put(move,'O');if(!finish()){busy=false;status.textContent='Tu turno · ×';caption.textContent='¿Dónde irá tu siguiente pincelada?';sync()}},650+Math.random()*280)});button.addEventListener('keydown',e=>{const offset={ArrowRight:1,ArrowLeft:-1,ArrowUp:6,ArrowDown:3}[e.key];if(offset!==undefined){e.preventDefault();let next=i;for(let n=0;n<9;n++){next=(next+offset+9)%9;if(!buttons[next].disabled){buttons[next].focus();break}}}});board.append(button);return button});
document.querySelector('#restart').addEventListener('click',()=>{clearTimeout(timer);round++;cells.fill('');busy=over=false;buttons.forEach(b=>{b.innerHTML='';b.classList.remove('winner')});winLine.setAttribute('hidden','');winLine.removeAttribute('class');status.textContent='Tu turno · ×';caption.textContent='Empiezas tú. Elige tu rincón.';sync()});for(let i=0;i<9;i++){const petal=document.createElement('i');petal.className='petal';petal.style.left=(i*12)+'%';petal.style.animationDuration=(16+i*1.3)+'s';petal.style.animationDelay=(-i*3)+'s';document.querySelector('#scene').append(petal)}document.addEventListener('visibilitychange',()=>document.querySelector('#scene').classList.toggle('paused',document.hidden));sync();
})();
</script></body></html>
