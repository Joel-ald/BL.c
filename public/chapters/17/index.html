<script>
(()=>{'use strict';const $=s=>document.querySelector(s),world=$('#world'),canvas=$('#snow'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),snowman=$('#snowman'),dog=$('#dog'),hearts=$('#hearts');let W=0,H=0,flakes=[],last=0,raf=0,time=0,wind=0,targetWind=0,visible=true;const timers=new Set();function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
let lensFlakes=[],nextLens=2.2;
function flake(initial=false){const z=Math.random(),near=z>.84;return{x:Math.random()*W,y:initial?Math.random()*H:-25,r:near?3+Math.random()*3.2:.5+z*2.2,speed:12+z*z*68,phase:Math.random()*Math.PI*2,angle:Math.random()*Math.PI,spin:(Math.random()-.5)*.55,alpha:near?.28+Math.random()*.25:.18+z*.48,near,crystal:false}}
function resetSnow(){flakes=Array.from({length:window.__BLANCA_WORLD__?.tier==='light'?48:W<600?85:125},()=>flake(true));lensFlakes=[];nextLens=time+2.2}
function resize(){W=world.clientWidth;H=world.clientHeight;const d=Math.min(devicePixelRatio||1,1.5,window.__BLANCA_WORLD__?.pixelRatio??1);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);resetSnow();paint(0)}
addEventListener('blanca:state',()=>resize());

function addLens(){if(lensFlakes.length)return;const candidates=flakes.filter(f=>f.near&&(f.x<W*.2||f.x>W*.8)&&f.y>H*.23&&f.y<H*.48);if(!candidates.length){nextLens=time+1;return}const source=candidates[Math.floor(Math.random()*candidates.length)];const duration=1.1,dx=wind*.7+Math.sin(source.phase)*12,dy=source.speed*duration;const f={x:source.x,y:source.y,dx,dy,born:time,r:11+Math.random()*6,initialR:source.r,initialAlpha:source.alpha,life:12,duration,grains:Array.from({length:9},()=>{const a=Math.random()*Math.PI*2,d=Math.random()*.62;return{x:Math.cos(a)*d,y:Math.sin(a)*d,r:.22+Math.random()*.23}})};lensFlakes.push(f);Object.assign(source,flake());nextLens=time+15+Math.random()*7}
function softSnow(x,y,r,alpha){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(246,250,251,'+alpha+')');g.addColorStop(.48,'rgba(242,248,251,'+alpha*.65+')');g.addColorStop(1,'rgba(242,248,251,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function drawLens(){for(const f of lensFlakes){const age=time-f.born;if(age<0)continue;const t=Math.min(1,age/f.duration),landed=age>=f.duration,contact=Math.max(0,age-f.duration),melt=Math.max(0,Math.min(1,(contact-2.1)/7.8)),fade=Math.max(0,Math.min(1,(f.life-age)/2)),r=f.initialR+(f.r-f.initialR)*t*t;ctx.save();ctx.translate(f.x+f.dx*t,f.y+f.dy*t+Math.pow(melt,3)*14);if(!landed){softSnow(0,0,r*1.5,f.initialAlpha*(1-t)+.32*t)}else{const settle=Math.min(1,contact/.18);ctx.scale(1+.13*settle,1-.08*settle);for(const grain of f.grains){softSnow(grain.x*r*(1-melt*.3),grain.y*r*(1-melt*.3),grain.r*r*(1-melt*.4),.29*(1-melt)*fade)}const wet=Math.min(1,contact/2)*fade;ctx.fillStyle='rgba(166,203,222,'+.035*wet+')';ctx.beginPath();ctx.ellipse(0,0,r*.53,r*(.48+melt*.15),-.15,0,Math.PI*2);ctx.fill();ctx.lineWidth=.8;ctx.strokeStyle='rgba(246,253,255,'+.15*wet+')';ctx.beginPath();ctx.ellipse(-r*.04,-r*.03,r*.43,r*(.4+melt*.14),-.15,3.5,5.05);ctx.stroke();softSnow(-r*.25,-r*.27,1.8,.2*wet);ctx.strokeStyle='rgba(99,148,177,'+.07*wet+')';ctx.beginPath();ctx.ellipse(0,0,r*.48,r*(.43+melt*.16),-.15,.5,2);ctx.stroke()}ctx.restore()}lensFlakes=lensFlakes.filter(f=>time-f.born<f.life)}
function paint(dt){ctx.clearRect(0,0,W,H);wind+=(targetWind-wind)*Math.min(1,dt*2);for(const f of flakes){if(!reduced.matches){f.y+=f.speed*dt;f.x+=(Math.sin(time*.5+f.phase)*(f.near?13:5)+wind*(f.near?1.7:.7))*dt;f.angle+=f.spin*dt;if(f.y>H+25)Object.assign(f,flake());if(f.x>W+25)f.x=-25;if(f.x<-25)f.x=W+25}ctx.save();ctx.translate(f.x,f.y);if(f.near){const g=ctx.createRadialGradient(0,0,0,0,0,f.r*1.6);g.addColorStop(0,'rgba(249,251,247,'+f.alpha+')');g.addColorStop(.35,'rgba(249,251,247,'+f.alpha*.65+')');g.addColorStop(1,'rgba(249,251,247,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,f.r*1.6,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='rgba(249,251,247,'+f.alpha+')';ctx.beginPath();ctx.ellipse(0,0,f.r,f.r*1.2,f.angle,0,Math.PI*2);ctx.fill()}ctx.restore()}if(!reduced.matches){if(time>=nextLens){addLens()}drawLens()}}
function loop(now){raf=0;if(document.hidden||!visible)return;const dt=last?Math.min((now-last)/1000,.06):0;last=now;time+=dt;paint(dt);if(!reduced.matches)raf=requestAnimationFrame(loop)}function run(){if(!raf&&!document.hidden&&visible){last=0;raf=requestAnimationFrame(loop)}}function burst(x,y){if(reduced.matches)return;for(let i=0;i<4;i++){const heart=document.createElementNS('http://www.w3.org/2000/svg','path');heart.setAttribute('d','M0 4C-14-4-9-14 0-7C9-14 14-4 0 4');const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform','translate('+(x+(i-1.5)*19)+' '+(y+Math.random()*16)+')');heart.setAttribute('class','heart');heart.style.animationDelay=i*.13+'s';g.append(heart);hearts.append(g);later(()=>g.remove(),2400)}}let petAt=-Infinity,helloAt=-Infinity;function pet(){if(performance.now()-petAt<1800)return;petAt=performance.now();dog.classList.add('happy');burst(511,535);$('#status').textContent='El perrito mueve su colita, bien abrigado.';later(()=>dog.classList.remove('happy'),1900)}function hello(){if(performance.now()-helloAt<2100)return;helloAt=performance.now();snowman.classList.add('hello');burst(294,348);$('#status').textContent='El muñeco te saluda y mueve su gorrito.';later(()=>snowman.classList.remove('hello'),2200)}for(const [el,fn]of [[dog,pet],[snowman,hello]]){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}world.addEventListener('pointermove',e=>{targetWind=(e.clientX/W-.5)*18},{passive:true});world.addEventListener('pointerleave',()=>targetWind=0);function visibility(){world.classList.toggle('paused',document.hidden||!visible);if(document.hidden||!visible){cancelAnimationFrame(raf);raf=0;last=0}else run()}document.addEventListener('visibilitychange',visibility);reduced.addEventListener('change',()=>{cancelAnimationFrame(raf);raf=0;run()});addEventListener('resize',resize,{passive:true});addEventListener('blanca:state',e=>{visible=e.detail?.visible!==false;visibility()});if(window.__BLANCA_WORLD__)visible=window.__BLANCA_WORLD__.visible!==false;resize();run();})();
</script></body></html>
