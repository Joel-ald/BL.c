</div><div class="vignette"></div><div class="bottom-note"><div class="hint"><svg viewBox="0 0 60 64" aria-hidden="true"><use href="#paw"/></svg><span id="hint">Toca la huellita que brilla.</span></div><button class="restart" id="restart" hidden>Volver a descubrir el camino</button></div><p class="sr-only" id="status" aria-live="polite" aria-atomic="true"></p></main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),world=$('#world'),scene=$('#scene'),dog=$('#dog'),map=$('#path-map'),flowers=$('#flowers'),hint=$('#hint'),restart=$('#restart'),status=$('#status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),NS='http://www.w3.org/2000/svg';
const stops=[{x:47,y:85,a:-20},{x:64,y:76,a:24},{x:39,y:67,a:-28},{x:65,y:59,a:20},{x:43,y:51,a:-12},{x:50,y:44,a:5}];
let step=0,busy=false,finished=false,sound=false,audio=null,petCount=0,petDown=false,petAt=0,seed=52;
const timers=new Set(),later=(fn,ms)=>{const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id};
const rand=()=>{seed=seed*16807%2147483647;return(seed-1)/2147483646};
function svg(tag,attrs){const el=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);return el}
function art(id,viewBox='0 0 220 280'){return '<svg viewBox="'+viewBox+'" aria-hidden="true"><use href="#'+id+'"/></svg>'}
// Individually placed plants retain their proportions on narrow screens.
const plants=[['fern',4,-2,310,18,10],['broadleaf',95,-1,290,-20,10],['bells',12,5,170,-12,9],['fern',87,6,200,-22,9],['grass',25,-3,190,-4,10],['grass',72,-2,180,8,10],['broadleaf',-2,27,240,22,5],['fern',102,31,260,-20,5],['bells',19,33,112,-9,5],['broadleaf',81,43,140,-22,4],['grass',24,41,110,-10,3],['fern',16,49,150,18,3],['fern',89,55,160,-30,3],['grass',5,56,145,5,3],['broadleaf',30,53,100,14,3],['bells',91,21,130,15,5],['grass',47,-5,140,3,10],['fern',39,4,120,-25,5]];
plants.forEach(([id,x,bottom,size,angle,z],i)=>{const el=document.createElement('div');el.className='flora'+(i%3===0?' breeze':'');el.style.cssText='--x:'+x+'%;--bottom:'+bottom+'%;--size:clamp('+size*.52+'px,'+size/11+'vw,'+size+'px);--angle:'+angle+'deg;--z:'+z+';--speed:'+(7+i%5)+'s';el.innerHTML=art(id,id==='bells'?'0 0 160 250':id==='grass'?'0 0 150 160':id==='broadleaf'?'0 0 200 270':'0 0 220 280');$('#plants').append(el)});
for(let i=0;i<47;i++){const e=document.createElement('i');e.className='star';e.style.cssText='left:'+rand()*100+'%;top:'+rand()*95+'%;animation-delay:-'+rand()*6+'s;opacity:'+(rand()*.5+.12);$('#stars').append(e)}
const flies=[];for(let i=0;i<19;i++){const el=document.createElement('i');el.className='firefly';const home={x:12+rand()*76,y:35+rand()*53};el.style.cssText='--x:'+home.x+'%;--y:'+home.y+'%;--speed:'+(3+rand()*4)+'s;--delay:-'+rand()*7+'s';$('#fireflies').append(el);flies.push({el,home})}
for(let i=0;i<7;i++){const e=document.createElement('i');e.className='petal';e.style.cssText='--x:'+rand()*100+'%;--y:'+(20+rand()*50)+'%;--speed:'+(12+rand()*13)+'s;--delay:-'+rand()*20+'s';$('#petals').append(e)}
let previous={x:48,y:96};const buttons=[],segments=[],blooms=[];
stops.forEach((p,i)=>{const d='M'+previous.x*10+' '+previous.y*10+' C'+previous.x*10+' '+(previous.y*10-50)+','+p.x*10+' '+(p.y*10+50)+','+p.x*10+' '+p.y*10;map.append(svg('path',{d,class:'trail-shadow'}));const glow=svg('path',{d,class:'line-glow'}),line=svg('path',{d,class:'trail-line'});map.append(glow,line);segments.push([glow,line]);previous=p;
 const b=document.createElement('button');b.className='paw-stop';b.style.cssText='--x:'+p.x+'%;--y:'+p.y+'%;--angle:'+p.a+'deg';b.setAttribute('aria-label','Seguir la huella '+(i+1)+' de '+stops.length);b.innerHTML=art('paw','0 0 60 64');b.addEventListener('click',()=>advance(i));b.addEventListener('pointerdown',e=>{if(e.button!==0)return;tracing=true;advance(i)});scene.append(b);buttons.push(b);
 const group=[];for(let j=0;j<3;j++){const bloom=document.createElement('div');bloom.className='bloom';bloom.style.cssText='--x:'+(p.x+(j-1)*7)+'%;--y:'+(p.y+3+j%2*2)+'%;transition-delay:'+(j*.12)+'s';bloom.innerHTML=art('flower','0 0 100 150');if((i+j)%3===0)bloom.style.filter='hue-rotate(16deg)';flowers.append(bloom);group.push(bloom)}blooms.push(group);
});
function sync(){buttons.forEach((b,i)=>{b.classList.toggle('current',i===step&&!finished);b.classList.toggle('done',i<step);b.classList.toggle('ahead',i===step+1&&!finished);b.disabled=i!==step||busy||finished;b.tabIndex=i===step&&!busy&&!finished?0:-1;b.setAttribute('aria-hidden',String(i>step+1||finished))})}
function setCopy(eyebrow,title,text){$('#copy').classList.add('changing');later(()=>{$('#eyebrow').textContent=eyebrow;$('#heading').innerHTML=title;$('#subheading').innerHTML=text;$('#copy').classList.remove('changing')},reduced.matches?0:350)}
function chime(index,pet=false){if(!sound||document.hidden)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const at=audio.currentTime,notes=pet?[659,880]:[392,440,523,587,659,784].slice(index%6,index%6+1).concat([784+index*22]);notes.forEach((hz,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(0,at+i*.12);gain.gain.linearRampToValueAtTime(.045,at+i*.12+.02);gain.gain.exponentialRampToValueAtTime(.001,at+i*.12+.8);osc.connect(gain);gain.connect(audio.destination);osc.start(at+i*.12);osc.stop(at+i*.12+.85)})}catch{sound=false;$('#sound').setAttribute('aria-pressed','false');$('#sound').setAttribute('aria-label','Activar sonidos')}}
function gather(p){flies.forEach(({el},i)=>{if(i%3===step%3||finished){el.style.setProperty('--x',(p.x+Math.sin(i*2.4)*14)+'%');el.style.setProperty('--y',(p.y-8+Math.cos(i*1.7)*8)+'%')}})}
function advance(i){if(i!==step||busy||finished)return;const fromKeyboard=document.activeElement===buttons[i];busy=true;segments[i].forEach(el=>el.classList.add('revealed'));blooms[i].forEach(el=>el.classList.add('open'));chime(i);step++;sync();gather(stops[i]);dog.classList.add('running');const target=stops[Math.min(step,stops.length-1)];dog.style.left=(target.x+(step%2?-8:8))+'%';dog.style.top=(target.y+4)+'%';hint.textContent='Él conoce el camino…';
 if(step===2)setCopy('Parece que te ha reconocido','Unas huellitas.<br><em>Y todo un mundo.</em>','Hay quien sabe encontrarte<br>sin que tengas que decir nada.');
 if(step===4)setCopy('Ya casi está','Mira quién va<br><em>delante de ti.</em>','A veces, el cariño también<br>tiene cuatro patitas.');
 later(()=>{dog.classList.remove('running');busy=false;if(step===stops.length){finish(fromKeyboard)}else{sync();hint.textContent='Sigue la siguiente huellita.';status.textContent='El jardín ha florecido. Sigue la huella '+(step+1)+'.';if(fromKeyboard)buttons[step].focus({preventScroll:true})}},reduced.matches?0:1750)}
function positionAtHome(){const nook=$('.nook').getBoundingClientRect(),r=scene.getBoundingClientRect();dog.style.left='50%';dog.style.top=((nook.top-r.top+nook.height*.85)/r.height*100)+'%'}
function finish(focus){finished=true;world.classList.add('complete');sync();positionAtHome();dog.setAttribute('aria-label','Acariciar al perrito');gather({x:50,y:55});restart.hidden=false;setCopy('Aquí termina el mapa','Su lugar favorito<br><em>eres tú.</em>','De todos los caminos del mundo,<br>él elegiría el que lo lleva contigo.');hint.textContent='Acaríciale la cabecita.';status.textContent='Has encontrado su refugio. Puedes acariciar al perrito.';later(()=>{if(focus)dog.focus({preventScroll:true});chime(4,true)},1200)}
let happyTimer=0,whisperTimer=0;
function pet(){const now=performance.now();if(now-petAt<300)return;petAt=now;dog.classList.add('happy');clearTimeout(happyTimer);happyTimer=setTimeout(()=>dog.classList.remove('happy'),1300);if(!finished)return;petCount++;if(petCount%3===1)chime(0,true);const r=dog.getBoundingClientRect(),s=scene.getBoundingClientRect();for(let i=0;i<2;i++){const heart=document.createElement('span');heart.className='heart';heart.setAttribute('aria-hidden','true');heart.textContent=i?'♡':'♥';heart.style.cssText='--x:'+(r.left-s.left+r.width*(.4+i*.22))+'px;--y:'+(r.top-s.top+22+i*9)+'px;animation-delay:'+(i*.12)+'s';scene.append(heart);later(()=>heart.remove(),2100)}
 const messages=['Contigo, está en casa.','Qué bonito que se tengan.','Hay cariños que no necesitan palabras.'];$('#whisper').textContent=messages[Math.floor((petCount-1)/3)%messages.length];$('#whisper').classList.add('show');clearTimeout(whisperTimer);whisperTimer=setTimeout(()=>$('#whisper').classList.remove('show'),3200)}
dog.addEventListener('pointerdown',e=>{if(e.button!==0)return;petDown=true;dog.setPointerCapture(e.pointerId);pet()});dog.addEventListener('pointermove',()=>{if(petDown)pet()});dog.addEventListener('pointerup',()=>petDown=false);dog.addEventListener('pointercancel',()=>petDown=false);dog.addEventListener('lostpointercapture',()=>petDown=false);dog.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});
// Following the active footprint with a finger works as well as tapping it.
let tracing=false;scene.addEventListener('pointerdown',e=>{if(e.target.closest('.dog,button'))return;tracing=true});scene.addEventListener('pointermove',e=>{if(!tracing||busy||finished)return;const r=buttons[step].getBoundingClientRect();if(Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)<38)advance(step)});addEventListener('pointerup',()=>tracing=false);addEventListener('pointercancel',()=>tracing=false);
$('#sound').addEventListener('click',()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',String(sound));$('#sound').setAttribute('aria-label',sound?'Silenciar sonidos':'Activar sonidos');if(sound)chime(0);else audio?.suspend()});
restart.addEventListener('click',()=>{timers.forEach(clearTimeout);timers.clear();clearTimeout(happyTimer);clearTimeout(whisperTimer);step=0;busy=false;finished=false;petCount=0;petDown=false;tracing=false;scene.querySelectorAll('.heart').forEach(el=>el.remove());world.classList.remove('complete');dog.classList.remove('happy','running');dog.style.left='69%';dog.style.top='85%';dog.setAttribute('aria-label','Saludar al perrito');$('.whisper').classList.remove('show');$('.whisper').textContent='';status.textContent='El camino vuelve a empezar. Sigue la primera huella.';segments.flat().forEach(el=>el.classList.remove('revealed'));blooms.flat().forEach(el=>el.classList.remove('open'));flies.forEach(({el,home})=>{el.style.setProperty('--x',home.x+'%');el.style.setProperty('--y',home.y+'%')});restart.hidden=true;hint.textContent='Toca la huellita que brilla.';setCopy('Un camino que solo tú conoces','Hay alguien<br><em>esperándote.</em>','A veces, para encontrar algo bonito,<br>solo hay que seguir unas huellitas.');sync();buttons[0].focus({preventScroll:true})});
let hostVisible=true;function visibility(){const paused=document.hidden||!hostVisible;world.classList.toggle('paused',paused);if(paused)audio?.suspend()}
document.addEventListener('visibilitychange',visibility);addEventListener('resize',()=>{if(finished)positionAtHome()},{passive:true});
function hostState(detail){if(!detail)return;hostVisible=detail.visible!==false;world.classList.toggle('light',detail.tier==='light');if(detail.muted){sound=false;$('#sound').setAttribute('aria-pressed','false');$('#sound').setAttribute('aria-label','Activar sonidos');audio?.suspend()}visibility()}
addEventListener('blanca:state',e=>hostState(e.detail));hostState(window.__BLANCA_WORLD__);visibility();sync();
})();
</script></body></html>
