<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>La flor del nueve</title>
<style>
:root{color-scheme:only light;background:#071c20;color:#f6ead0;font-family:Georgia,serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ffeab1;outline-offset:6px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#garden{opacity:0;transition:opacity 1.8s}body.arrived #garden{opacity:1}#mist{position:fixed;inset:0;background:#071c20;opacity:1;pointer-events:none;transition:opacity 1.8s}body.arrived #mist{opacity:0}
#greeting{position:absolute;top:16%;left:25px;right:25px;text-align:center;pointer-events:none;transition:opacity .7s}h1{font:normal 29px/1.25 Georgia,serif;margin:0 auto 16px;max-width:410px}#greeting p{font:italic 18px/1.5 Georgia;color:#b7d9d0;margin:0}body.arrived #greeting{opacity:0}
#fairy{position:fixed;z-index:4;width:190px;height:210px;left:calc(50% - 95px);top:36%;border:0;background:none;padding:0;transition:left 1.8s,top 1.8s,width 1.8s,height 1.8s;filter:drop-shadow(0 0 13px #b1e8cc55)}#fairy img{width:100%;height:100%;animation:hover 3s ease-in-out infinite}#fairy:after{content:'';position:absolute;left:68%;top:27%;width:26px;height:26px;border:1px solid #dfefcf;opacity:0;border-radius:50%;animation:knock 3s ease-out infinite}body.arrived #fairy{width:110px;height:120px;left:calc(50% + 45px);top:20%}body.arrived #fairy:after{display:none}body.flowered #fairy{left:calc(50% - 160px);top:22%}
@keyframes hover{50%{transform:translateY(-9px) rotate(3deg)}}@keyframes knock{0%,60%{opacity:0;transform:scale(.3)}65%{opacity:.8}90%,100%{opacity:0;transform:scale(2.8)}}
#glass-door{position:absolute;left:50%;top:50%;width:min(76%,420px);height:65%;border:1px solid #deefbd00;border-radius:50% 50% 8px 8px;transform:translate(-50%,-50%);pointer-events:none;transition:transform 1.6s,opacity 1.5s,border-color .2s;transform-origin:left;opacity:0}body.arrived #glass-door{border-color:#d9eab7;animation:door 1.8s both}@keyframes door{0%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(.12)}}
#flower{position:fixed;z-index:3;left:calc(50% - 54px);top:calc(55% - 54px);width:108px;height:108px;border:0;background:none;border-radius:50%;opacity:0;pointer-events:none;transition:opacity 1s}body.arrived:not(.flowered) #flower{opacity:1;pointer-events:auto}#flower:after{content:'';position:absolute;inset:27px;border:1px solid #ffe4a488;border-radius:50%;animation:knock 3s infinite}#wishes{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}body.flowered #wishes{opacity:1}.wish-star{position:absolute;width:44px;height:44px;border:0;background:transparent;border-radius:50%;pointer-events:auto;transform:translate(-50%,-50%);color:#fff4c9;font-size:23px;text-shadow:0 0 12px #ffd575}.wish-star[aria-pressed=true]{color:#fff;box-shadow:0 0 0 1px #ffe0a555}
#message{position:absolute;z-index:5;left:24px;right:24px;bottom:max(6%,24px);text-align:center;max-width:530px;margin:auto;pointer-events:none}#message h2{font-weight:normal;font-size:25px;line-height:1.25;margin:0 0 12px;color:#fbe8b9}#message p{font-size:17px;line-height:1.5;color:#c3ddd5;margin:0;white-space:pre-line}#message{opacity:0;transition:opacity 1s}body.arrived #message{opacity:1}
@media(min-width:800px){h1{font-size:37px}#message h2{font-size:30px}#message p{font-size:19px}}
@media(max-height:580px){#greeting{top:17%}h1{font-size:24px}#fairy{width:125px;height:140px;left:calc(50% - 62px)}body.arrived #fairy{top:15%;left:calc(50% + 110px)}#message{bottom:15px}#message h2{font-size:20px;margin-bottom:6px}#message p{font-size:15px}#flower{top:calc(48% - 54px)}}
#fairy img{animation:fairy-flight 5s ease-in-out infinite;transition:filter .5s}#fairy:hover img{filter:brightness(1.15)}#fairy.greet img{animation:fairy-greet 1.4s ease-in-out}body:not(.arrived) #fairy{filter:drop-shadow(0 0 18px #b1e8cc55) blur(.6px)}body.flowered #fairy{transition:left 2s ease-in-out,top 2s ease-in-out,width 1.8s,height 1.8s}body.flowered #fairy.perched{left:calc(50% + 30px);top:29%}body.finished #fairy{left:calc(50% - 55px);top:15%}body.finished #wishes{opacity:.65}#glass-door{opacity:1;border-color:#deefbd35;background:linear-gradient(115deg,#c5f9e00d,transparent 40%,#e3e9fc0a 55%,transparent 60%);box-shadow:inset 0 0 35px #dfffea08}body.arrived #glass-door{background:transparent}body.finished #message h2{font-size:25px}body.finished #message p{font-size:18px;color:#ebead2}
@keyframes fairy-flight{0%,100%{transform:translate(0,0) rotate(-2deg)}30%{transform:translate(7px,-10px) rotate(4deg)}65%{transform:translate(-5px,-4px) rotate(-3deg)}}@keyframes fairy-greet{30%{transform:translateY(-12px) rotate(-12deg)}65%{transform:translateY(-5px) rotate(9deg)}}
@media(max-height:580px){body.finished #message h2{font-size:19px}body.finished #message p{font-size:15px}body.finished #fairy{top:8%}}
@font-face{font-family:GardenHand;src:url('../02/fonts/hand.ttf') format('truetype');font-display:swap}
#greeting h1,#greeting p,#message h2,#message p{font-family:GardenHand,cursive;font-style:normal;font-weight:400;letter-spacing:0}#greeting h1{font-size:36px}#greeting p{font-size:24px}#message h2,body.finished #message h2{font-size:30px;line-height:1.15}#message p,body.finished #message p{font-size:25px;line-height:1.25}body.reading-note #message h2{display:none}#message{max-width:490px}@media(max-height:580px){#greeting h1{font-size:28px}#greeting p{font-size:21px}#message h2,body.finished #message h2{font-size:25px}#message p,body.finished #message p{font-size:21px}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="garden" aria-hidden="true"></canvas><div id="mist"></div><div id="glass-door"></div>
<header id="greeting"><h1>Alguien estaba esperando<br>al otro lado.</h1><p>Una pequeña visita para un día especial.</p></header>
<button id="fairy" aria-label="Tocar la mano del hada"><img src="fairy.svg" alt="Una pequeña hada de vestido verde, alas transparentes y polvo dorado"></button>
<button id="flower" aria-label="Entregar la luz a la flor" disabled></button>
<div id="wishes" role="group" aria-label="Nueve mensajes en los pétalos" inert></div>
<section id="message" aria-live="polite"><h2>Una flor todavía dormida.</h2><p>Hay días que merecen florecer un poquito más.</p></section>
<script>
const canvas=document.querySelector('#garden'),c=canvas.getContext('2d'),fairy=document.querySelector('#fairy'),flower=document.querySelector('#flower'),wishes=document.querySelector('#wishes'),heading=document.querySelector('#message h2'),copy=document.querySelector('#message p');
let host=window.__BLANCA_WORLD__||{tier:'light',visible:true,pixelRatio:1,muted:true},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,W=0,H=0,D=1,t=0,last=0,drawAt=0,stage=0,arrival=0,opened=0,background=document.createElement('canvas'),audio;
const notes=[['Mensaje 1','Certificada oficialmente por el reino de las hadas como un ser bastante bonito.'],['Mensaje 2','Sí, otra flor para ti… claramente ya perdí la dignidad.'],['Mensaje 3','Tienes cara de que las mariposas sí te contarían sus secretos.'],['Mensaje 4','Ojalá nunca pierdas esa parte tuya que todavía sabe maravillarse por cosas pequeñas.'],['Mensaje 5','Hay gente normal… y luego están las pequeñas rarezas que hacen bonito todo.'],['Mensaje 6','Espero que siempre encuentres un lugar donde puedas ser tú sin tener que bajar el volumen.'],['Mensaje 7','Que nunca te falte un poquito de magia, aunque el mundo insista en ponerse aburrido.'],['Mensaje 8','Demasiado bonita para este mundo, suficientemente extraña para hacerlo interesante.'],['Mensaje 9','Eres de esas personitas que parecen salidas de un cuento… pero de los buenos, no de los traumáticos.']];
const collected=new Map();let finaleAt=0,finished=false,greetUntil=0;
function greet(){fairy.classList.remove('greet');void fairy.offsetWidth;fairy.classList.add('greet');greetUntil=t+1.5}
function finishGarden(){finished=true;document.body.classList.remove('reading-note');document.body.classList.add('finished');heading.textContent='Y eso...';copy.textContent='Ojalá un día mires atrás y digas: Cuántas cosas bonitas pasaron.';chime(8)}
wishes.addEventListener('click',event=>{const button=event.target.closest('.wish-star');if(!button)return;document.body.classList.add('reading-note');const i=Array.from(wishes.children).indexOf(button);if(!collected.has(i))collected.set(i,t);button.dataset.found='true';fairy.classList.toggle('perched',i%2===0);greet();if(collected.size===9&&!finished)finaleAt=t+12});
fairy.addEventListener('pointerenter',greet);
function center(){return{x:W*.5,y:H*(H<580?.48:.55),r:Math.min(W*.32,H*.19,160)}}
function ellipse(ctx,x,y,rx,ry,a,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,a,0,Math.PI*2);ctx.fill()}
function leaf(ctx,x,y,s,a,color){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-s*.8,-s*.4,-s*.5,-s*1.5,0,-s*1.8);ctx.bezierCurveTo(s*.8,-s*.8,s*.7,-s*.3,0,0);ctx.fill();ctx.strokeStyle='#b5dcac25';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*1.6);ctx.stroke();ctx.restore()}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,host.pixelRatio||1,1.5);canvas.width=background.width=Math.round(W*D);canvas.height=background.height=Math.round(H*D);c.setTransform(D,0,0,D,0,0);const b=background.getContext('2d');b.setTransform(D,0,0,D,0,0);const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06191d');g.addColorStop(.55,'#143c3c');g.addColorStop(1,'#091f26');b.fillStyle=g;b.fillRect(0,0,W,H);
for(let i=0;i<9;i++){const x=(i/8)*W,s=W*.02+12;b.fillStyle=i%2?'#234a4444':'#385b4b22';b.beginPath();b.moveTo(x-s,H);b.bezierCurveTo(x+25,H*.5,x-30,H*.22,x-10,0);b.lineTo(x+12,0);b.bezierCurveTo(x,H*.4,x+s,H*.7,x+s,H);b.fill()}
for(let side=0;side<2;side++)for(let i=0;i<12;i++){const x=side?W-i%3*17:i%3*17,y=H*(.14+i*.072);leaf(b,x,y,22+(i%4)*11,side?-.8-i%3*.3:.8+i%3*.3,['#123631','#285444','#376851'][i%3])}
for(let i=0;i<11;i++){const x=(i+.3)/11*W,y=H*.9+Math.sin(i*2)*20;leaf(b,x,y,22+i%3*12,(i-5)*.13,'#235245')}
const p=center();document.querySelectorAll('.wish-star').forEach((el,i)=>{const a=i*Math.PI*2/9-Math.PI/2;el.style.left=p.x+Math.cos(a)*p.r*.88+'px';el.style.top=p.y+Math.sin(a)*p.r*.88+'px'})}
notes.forEach(([title,message],i)=>{const button=document.createElement('button');button.className='wish-star';button.type='button';button.textContent='✧';button.setAttribute('aria-label',title);button.setAttribute('aria-pressed','false');button.onclick=()=>{heading.textContent=title;copy.textContent=message;wishes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));chime(i)};wishes.append(button)});
function chime(i=0){if(host.muted||host.visible===false||document.hidden)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain(),at=audio.currentTime;o.frequency.value=[523,587,659,698,784,880,988,1047,1175][i];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.045,at+.035);g.gain.exponentialRampToValueAtTime(.0001,at+1.2);o.connect(g);g.connect(audio.destination);o.onended=()=>{o.disconnect();g.disconnect()};o.start();o.stop(at+1.25)}catch{}}
function enter(){if(stage===0){stage=1;arrival=t;document.body.classList.add('arrived');document.querySelector('#greeting').setAttribute('aria-hidden','true');fairy.setAttribute('aria-label','Seguir al hada hasta la flor');chime()}else if(stage===1)openFlower();else{document.body.classList.remove('reading-note');heading.textContent='Había algo guardado aquí.';copy.textContent='Nueve mensajitos entre los pétalos.';chime(4)}}
function openFlower(){if(stage!==1||t-arrival<1.6&&!reduced)return;stage=2;opened=t;flower.disabled=true;flower.tabIndex=-1;chime(4);heading.textContent='Hay días que merecen florecer un poquito más.';copy.textContent='El 9 de septiembre es uno de ellos.'}
fairy.addEventListener('click',enter);flower.addEventListener('click',openFlower);
function draw(){c.clearRect(0,0,W,H);c.drawImage(background,0,0,W,H);const p=center(),progress=stage<2?0:reduced?1:Math.min(1,(t-opened)/3.4),ease=progress*progress*(3-2*progress);
if(greetUntil&&t>greetUntil){fairy.classList.remove('greet');greetUntil=0}if(finaleAt&&t>=finaleAt&&!finished)finishGarden();
for(const [i,born] of collected){const growth=reduced?1:Math.min(1,(t-born)/2),side=i%2?1:-1,x=W*.5+side*W*(.25+(i%3)*.06),y=H*(.32+(i/9)*.4),size=(9+i%3*3)*growth;c.strokeStyle='#78bda1';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y+45);c.quadraticCurveTo(x+8,y+15,x,y);c.stroke();const glow=c.createRadialGradient(x,y,0,x,y,40);glow.addColorStop(0,'#f3d58e30');glow.addColorStop(1,'#f3d58e00');ellipse(c,x,y,40,40,0,glow);for(let j=0;j<5;j++){const a=j*Math.PI*2/5;ellipse(c,x+Math.cos(a)*size*.6,y+Math.sin(a)*size*.6,size*.45,size*.75,a+Math.PI/2,['#eab5ce','#b3deda','#e4cb91'][i%3])}ellipse(c,x,y,3,3,0,'#fff0ba')}
if(stage>0&&!reduced){const fx=W*.5+(stage<3?90:-100),fy=H*.27;for(let i=0;i<12;i++){const age=(t*.5+i/12)%1;c.globalAlpha=(1-age)*.65;ellipse(c,fx+Math.sin(age*5+i)*22-age*45,fy+age*95,1.6*(1-age)+.3,1.6*(1-age)+.3,0,'#fce5a1')}c.globalAlpha=1}
for(let i=0;i<(host.tier==='light'?22:48);i++){const x=((i*.618%1)*W)+Math.sin(t*.4+i)*9,y=(i*.371%1)*H;c.globalAlpha=.2+(1+Math.sin(t+i))* .25;ellipse(c,x,y,1.5,1.5,0,i%3?'#e4d5a0':'#a3e4cb')}c.globalAlpha=1;
c.strokeStyle='#699668';c.lineWidth=5;c.beginPath();c.moveTo(p.x,p.y+30);c.bezierCurveTo(p.x-30,p.y+100,p.x+20,H*.82,p.x,H*.91);c.stroke();leaf(c,p.x-5,p.y+p.r*.9,38,-1.1,'#4f886c');leaf(c,p.x+2,p.y+p.r*1.28,44,.9,'#78a174');
for(let i=0;i<9;i++){const a=i*Math.PI*2/9-Math.PI/2,dist=12+ease*p.r*.53,len=45+ease*p.r*.22,x=p.x+Math.cos(a)*dist,y=p.y+Math.sin(a)*dist;c.save();c.translate(x,y);c.rotate(a+Math.PI/2);const grad=c.createLinearGradient(0,-len,0,len);grad.addColorStop(0,['#f5c4db','#f3d5d7','#e4bfe2'][i%3]);grad.addColorStop(.55,'#d488a5');grad.addColorStop(1,'#744f82');ellipse(c,0,0,13+ease*p.r*.25,len,0,grad);c.strokeStyle='#ffe3dd65';c.lineWidth=1;c.beginPath();c.moveTo(0,len*.7);c.quadraticCurveTo(-6,0,0,-len*.8);c.stroke();c.restore()}
if(ease>0){ellipse(c,p.x,p.y,p.r*.41*ease,p.r*.41*ease,0,'#102c3a');c.strokeStyle='#e8c993';c.lineWidth=1.5;c.beginPath();c.arc(p.x,p.y,p.r*.41*ease,0,Math.PI*2);c.stroke();for(let i=0;i<24;i++){const a=i*2.4,r=Math.sqrt((i+1)/25)*p.r*.35*ease;ellipse(c,p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,1,1,0,'#f5dea3')}c.fillStyle='#f7ddb0';c.font=`italic ${Math.round(p.r*.38)}px Georgia`;c.textAlign='center';c.textBaseline='middle';c.fillText('9',p.x,p.y)}
if(stage===1){const pulse=reduced?1:1+Math.sin(t*2)*.1;ellipse(c,p.x,p.y-12,6*pulse,10*pulse,0,'#ffebb5');c.strokeStyle='#fff0c655';c.beginPath();c.arc(p.x,p.y-12,20,0,Math.PI*2);c.stroke()}
if(ease>.7){for(let i=0;i<9;i++){const a=i*Math.PI*2/9-Math.PI/2,x=p.x+Math.cos(a)*p.r*.92,y=p.y+Math.sin(a)*p.r*.92;ellipse(c,x+9,y-8,2.2,3.2,-.4,'#fff8ed90');ellipse(c,x+8,y-9,1,1,0,'#ffffff')}}
if(finished){const travel=reduced?1:Math.min(1,(t-finaleAt)/3),cy=H*.37,rx=Math.min(W*.1,40);for(let i=0;i<9;i++){const a=i*Math.PI*2/9-Math.PI/2,startX=p.x+Math.cos(a)*p.r*.88,startY=p.y+Math.sin(a)*p.r*.88,endX=i<6?p.x+Math.cos(i*Math.PI*2/6)*rx:p.x+rx-(i-5)*rx*.6,endY=i<6?cy+Math.sin(i*Math.PI*2/6)*rx:cy+(i-5)*rx*.7;const x=startX+(endX-startX)*travel,y=startY+(endY-startY)*travel;c.shadowColor='#ffe0a0';c.shadowBlur=12;ellipse(c,x,y,3,3,0,'#fff2c3');c.shadowBlur=0}}
if(stage===2&&progress===1){stage=3;document.body.classList.add('flowered');wishes.inert=false;fairy.setAttribute('aria-label','Escuchar al hada');wishes.querySelector('button').focus({preventScroll:true})}
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000||0,.05);last=now;if(document.hidden||host.visible===false)return;t+=dt;if(stage===1&&t-arrival>1.6)flower.disabled=false;if(now-drawAt<1000/(host.tier==='light'?30:45))return;drawAt=now;draw()}
addEventListener('resize',resize);addEventListener('blanca:state',e=>{host=e.detail;resize()});document.addEventListener('visibilitychange',()=>{if(document.hidden)audio?.suspend()});resize();draw();requestAnimationFrame(frame);
</script></body></html>
