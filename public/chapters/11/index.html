</style></head><body><main class="world" id="world"><canvas id="river" aria-label="Barquitos de papel navegan hacia la derecha entre árboles y flores dibujados." role="img"></canvas><div class="vignette"></div><div class="copy" id="copy"><h1 id="phrase"></h1></div><button class="launch" id="launch" aria-label="Soltar el barquito de papel"><span>toca el barquito</span></button><button class="sound" id="sound" aria-label="Activar sonidos del arroyo" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4Z"/><path class="on" d="M15 8q5 4 0 8m3-11q8 7 0 14"/><path class="off" d="m16 9 5 6m0-6-5 6"/></svg></button><button class="replay" id="replay" aria-label="Volver a navegar" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h10a6 6 0 0 1 0 12"/></svg></button><p class="sr-only" id="status" role="status" aria-live="polite"></p></main><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),world=$('#world'),canvas=$('#river'),c=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');const TAU=Math.PI*2,DURATION=76,END=4750;let W=0,H=0,scale=1,time=0,elapsed=0,distance=0,started=false,finished=false,last=0,lastPaint=0,raf=0,hostVisible=true,stage=-1,ripples=[],sparks=[],sound=false,audio=null,waterSound=null,master=null,melodyAt=0;let seed=73;const rand=()=>{seed=seed*16807%2147483647;return(seed-1)/2147483646},clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
function riverX(y){return Math.sin(y*.00175)*112+Math.sin(y*.0039+.7)*37}function riverWidth(y){return 152+Math.sin(y*.0024)*15+35*Math.exp(-Math.pow((y-4870)/530,2))}function view(x,y){return{x:W*.5+(y-distance)*scale,y:H*.59+(x-riverX(distance))*.42*scale}}function ellipse(x,y,rx,ry,color,angle=0){c.fillStyle=color;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),angle,0,TAU);c.fill()}function glow(x,y,r,color,alpha){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+color+','+alpha+')');g.addColorStop(1,'rgba('+color+',0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
const plants=Array.from({length:440},()=>{const y=-900+rand()*6800,side=rand()>.5?1:-1;return{y,x:riverX(y)+side*(riverWidth(y)+12+rand()*330),s:25+rand()*50,type:Math.floor(rand()*5),angle:rand(),shade:rand(),side}});const stones=Array.from({length:145},()=>{const y=-700+rand()*6400,side=rand()>.5?1:-1;return{y,x:riverX(y)+side*(riverWidth(y)-5+rand()*48),r:9+rand()*23}});const flowers=Array.from({length:125},()=>{const y=-700+rand()*6500,side=rand()>.5?1:-1;return{y,x:riverX(y)+side*(riverWidth(y)+9+rand()*75),r:5+rand()*7,p:rand()*TAU,pink:rand()>.45}});const leaves=Array.from({length:38},()=>({y:rand()*5700,x:rand()*2-1,p:rand()*TAU,r:6+rand()*6}));const lilies=Array.from({length:30},(_,i)=>{const a=i*2.399,rad=100+Math.sqrt(i/30)*240;return{x:riverX(4870)+Math.cos(a)*rad*.87,y:4870+Math.sin(a)*rad*.9,r:14+rand()*9,p:rand()*TAU}});const fireflies=Array.from({length:32},()=>({x:rand()*2-1,y:rand()*2-1,p:rand()*TAU}));
plants.sort((a,b)=>b.y-a.y);
function bankPath(offset){const near=distance-(W*.6/scale)-250,far=distance+(W*.6/scale)+250;c.beginPath();for(let y=near,i=0;y<=far;y+=22,i++){const p=view(riverX(y)-riverWidth(y)-offset,y);if(!i)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y)}for(let y=far;y>=near;y-=22){const p=view(riverX(y)+riverWidth(y)+offset,y);c.lineTo(p.x,p.y)}c.closePath()}
function leaf(x,y,size,angle,color){c.save();c.translate(x,y);c.rotate(angle);c.fillStyle=color;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-size*.52,-size*.32,-size*.39,-size*.92,0,-size);c.bezierCurveTo(size*.45,-size*.82,size*.42,-size*.27,0,0);c.fill();c.strokeStyle='#d1e0bf23';c.lineWidth=1;c.beginPath();c.moveTo(0,0);c.lineTo(0,-size*.82);c.stroke();c.restore()}
function flower(x,y,r,p,pink=true,bloom=1){c.save();c.translate(x,y);c.scale(bloom,bloom);const sway=reduced.matches?0:Math.sin(time*.8+p)*.05;c.rotate(sway);for(let i=0;i<5;i++){const a=i*TAU/5;ellipse(Math.cos(a)*r*.53,Math.sin(a)*r*.4,r*.48,r*.64,pink?'#d1a8b3':'#d9d8bb',a-Math.PI*.5)}ellipse(0,0,r*.25,r*.2,'#edcd94');c.restore()}
function plant(p){const v=view(p.x,p.y);if(v.y<-140||v.y>H+160||v.x<-140||v.x>W+140)return;const s=p.s*scale;ellipse(v.x,v.y+3,s*.46,s*.12,'#112c3938');if(p.type===0){c.strokeStyle='#7a9994';c.lineWidth=2*scale;c.beginPath();c.moveTo(v.x,v.y);c.quadraticCurveTo(v.x-4,v.y-s*.55,v.x+3,v.y-s);c.stroke();for(let i=0;i<5;i++){leaf(v.x,v.y-i*s*.17,s*(.5-i*.065),-.95,'#6c9691');leaf(v.x+1,v.y-i*s*.17,s*(.47-i*.06),1,'#80a098')}}else if(p.type===1){for(let i=0;i<4;i++)leaf(v.x,v.y,s*(.65+i*.1),(i-1.5)*.56,p.shade>.4?'#678e90':'#537c84')}else if(p.type===2){ellipse(v.x,v.y-s*.18,s*.37,s*.22,'#6c9891');ellipse(v.x-s*.2,v.y-s*.11,s*.23,s*.14,'#789e91');for(let i=0;i<4;i++)ellipse(v.x+(i-1.5)*s*.13,v.y-s*.2,s*.027,s*.025,'#a3b6a277')}else if(p.type===3){c.strokeStyle='#9db1a0';c.lineWidth=2*scale;c.beginPath();c.moveTo(v.x,v.y);c.lineTo(v.x,v.y-s*.37);c.stroke();ellipse(v.x,v.y-s*.4,s*.23,s*.12,'#b89099');ellipse(v.x-s*.06,v.y-s*.43,s*.035,s*.023,'#ebd4c2');ellipse(v.x+s*.08,v.y-s*.41,s*.03,s*.023,'#ebd4c2')}else{for(let i=0;i<3;i++){c.strokeStyle=i%2?'#a8b59b':'#668e86';c.lineWidth=2*scale;c.beginPath();c.moveTo(v.x,v.y);c.quadraticCurveTo(v.x+(i-1)*s*.25,v.y-s*.6,v.x+(i-1)*s*.45,v.y-s*.7);c.stroke()}}}
function water(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6394a6');g.addColorStop(1,'#85b2bc');bankPath(12);c.fillStyle='#9bb7a352';c.fill();bankPath(0);c.fillStyle=g;c.fill();c.save();bankPath(-5);c.clip();const near=distance-H/scale,far=distance+H/scale;for(let y=Math.floor(near/38)*38;y<far;y+=38){const p=view(riverX(y),y);const phase=reduced.matches?0:time*12;for(let j=-2;j<=2;j++){const xx=p.x+j*49*scale+Math.sin(y*.02)*15*scale,yy=p.y-(phase%38)*scale;c.strokeStyle=j%2?'#aed5d519':'#c7e0d516';c.lineWidth=1;c.beginPath();c.ellipse(xx,yy,14*scale,2*scale,Math.sin(y)*.2,0,Math.PI);c.stroke()}}const light=view(riverX(distance+220),distance+220);glow(light.x,light.y,220*scale,'144,193,187',.12);for(const l of leaves){const y=l.y+(reduced.matches?0:time*5),v=view(riverX(y)+l.x*(riverWidth(y)-25),y);if(v.y<-30||v.y>H+30)continue;leaf(v.x,v.y,l.r*scale,l.p+Math.sin(time*.3+l.p)*.2,'#b0b49b');c.strokeStyle='#c5dbcd25';c.beginPath();c.ellipse(v.x,v.y+4,l.r*scale*1.2,3*scale,0,0,Math.PI);c.stroke()}c.restore()}
function riffle(y){const p=view(riverX(y),y),rw=riverWidth(y)*scale;if(p.y<-80||p.y>H+100)return;c.save();bankPath(-8);c.clip();c.fillStyle='#224b5d55';c.fillRect(p.x-rw,p.y-4,rw*2,29*scale);for(let i=0;i<24;i++){const xx=p.x-rw+i*rw/12,phase=(time*.8+i*.41)%1;const top=p.y+Math.sin(i*1.3)*3*scale;c.strokeStyle='rgba(205,234,229,'+(.13+Math.sin(phase*Math.PI)*.23)+')';c.lineWidth=(1+i%3)*scale;c.lineCap='round';c.beginPath();c.moveTo(xx,top);c.quadraticCurveTo(xx+3*scale,top-10*scale,xx+2*scale,top-(15+phase*15)*scale);c.stroke();ellipse(xx+2*scale,top-23*scale,(2+i%3)*scale,1.7*scale,'#cae4d842')}c.restore()}
function bridge(){const y=1960,p=view(riverX(y),y),rw=riverWidth(y)*scale+37*scale;if(p.y<-100||p.y>H+100)return;ellipse(p.x,p.y+22*scale,rw,18*scale,'#152c4244');c.save();c.translate(p.x,p.y);c.rotate(-.065);c.fillStyle='#817d83';c.fillRect(-rw,-25*scale,rw*2,53*scale);for(let x=-rw;x<rw;x+=22*scale){c.fillStyle=(Math.floor(x/(22*scale))%2)?'#a59994':'#b3a49a';c.fillRect(x,-25*scale,20*scale,50*scale);c.strokeStyle='#cebaab40';c.lineWidth=1;c.beginPath();c.moveTo(x+5*scale,-18*scale);c.lineTo(x+6*scale,18*scale);c.stroke()}c.strokeStyle='#596f78';c.lineWidth=5*scale;c.lineCap='round';for(const side of [-1,1]){c.beginPath();c.moveTo(-rw,side*27*scale);c.quadraticCurveTo(0,side*36*scale,rw,side*27*scale);c.stroke();for(let x=-rw;x<=rw;x+=50*scale){c.beginPath();c.moveTo(x,side*25*scale);c.lineTo(x,side*25*scale-12*scale);c.stroke()}}c.restore()}
function boat(position=null,tint=0,size=1){const p=position||view(riverX(distance),distance),bob=reduced.matches?0:Math.sin(time*1.7)*1.3,tilt=reduced.matches?0:Math.sin(time*.7)*.025;c.save();c.translate(p.x,p.y+bob);c.rotate(tilt);c.scale(scale*1.3*size,scale*1.3*size);if(tint)c.filter="hue-rotate("+tint+"deg)";for(let i=0;i<4;i++){const t=(time*.3+i*.25)%1;c.strokeStyle='rgba(211,240,236,'+(1-t)*.22+')';c.lineWidth=1;c.beginPath();c.ellipse(-43-t*28,19,20+t*20,3+t*5,0,0,Math.PI);c.stroke()}ellipse(0,25,49,7,'#183f5655');function poly(points,fill,stroke){c.fillStyle=fill;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.2;c.lineJoin='round';c.stroke()}}c.save();c.translate(0,38);c.scale(1,-.35);c.globalAlpha=.12;poly([[-61,-30],[-38,23],[35,23],[61,-30],[0,0]],'#a7e1e3');c.restore();poly([[-61,-32],[0,-1],[61,-30],[25,13],[-28,12]],'#4b9eac','#77c1c8');poly([[-16,2],[0,-12],[16,2],[0,13]],'#84cdd2','#a6e0dc');poly([[-61,-32],[-38,23],[-2,29],[0,9]],'#70bcc7','#a3dbda');poly([[0,9],[61,-30],[36,24],[-2,29]],'#459cae','#82c8cc');poly([[-61,-32],[-15,3],[0,9],[-38,23]],'#63adbd');poly([[0,9],[18,0],[61,-30],[36,24]],'#57abba');c.strokeStyle='#c4eeea';c.lineWidth=1.6;c.beginPath();c.moveTo(-60,-31);c.lineTo(0,9);c.lineTo(60,-29);c.stroke();c.strokeStyle='#35889b88';c.lineWidth=.9;c.beginPath();c.moveTo(0,10);c.lineTo(-2,27);c.moveTo(-37,22);c.lineTo(-52,-16);c.stroke();c.restore()}
function pond(){const bloom=smooth((distance-4080)/650);for(const l of lilies){const p=view(l.x,l.y);if(p.y<-60||p.y>H+70)continue;const r=l.r*scale;ellipse(p.x,p.y+3,r*1.05,r*.57,'#163f5140');c.fillStyle='#6a9b94';c.beginPath();c.ellipse(p.x,p.y,r,r*.58,l.p,0,TAU);c.fill();c.fillStyle='#365e71';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+r*Math.cos(l.p-.16),p.y+r*.6*Math.sin(l.p-.16));c.lineTo(p.x+r*Math.cos(l.p+.16),p.y+r*.6*Math.sin(l.p+.16));c.closePath();c.fill();if(bloom>0){glow(p.x,p.y,r*2.5,'222,194,193',bloom*.13);flower(p.x,p.y-r*.14,r*.62,l.p,true,.08+bloom*.92)}}if(distance>4050){for(const f of fireflies){const xx=riverX(4820)+f.x*300+Math.sin(time*.45+f.p)*12,yy=4820+f.y*330+Math.cos(time*.4+f.p)*8,p=view(xx,yy),alpha=(.25+.55*Math.pow(Math.sin(time*.65+f.p),2))*bloom;glow(p.x,p.y,15*scale,'250,225,158',alpha*.2);ellipse(p.x,p.y,1.6*scale,1.6*scale,'rgba(247,228,174,'+alpha+')')}}}
function lanterns(){if(!finished)return;const age=elapsed-DURATION;for(let i=0;i<7;i++){const a=clamp((age-i*.6)/9),x=W*.5+Math.sin(i*2.4)*(70+W*.19)*a,y=H*.59-a*H*.65+(i%3)*14,s=(.65+i%3*.1)*(1-a*.3);if(a<=0)continue;c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=1-a*.7;glow(0,0,48,'254,220,151',.16);c.fillStyle='#e1be96';c.beginPath();c.moveTo(-9,-12);c.quadraticCurveTo(0,-17,9,-12);c.lineTo(7,10);c.quadraticCurveTo(0,13,-7,10);c.closePath();c.fill();c.strokeStyle='#f4d9ab88';c.lineWidth=1;c.beginPath();c.moveTo(0,-13);c.lineTo(0,10);c.stroke();ellipse(0,8,2,3,'#ffe7b0');c.restore()}}
function street(){const lo=Math.floor((distance-H/scale)/170)*170,hi=distance+H/scale;for(let y=lo;y<hi;y+=170){if(y>4200)continue;for(const side of [-1,1]){const yy=y+(side===1?75:0),v=view(riverX(yy)+side*(riverWidth(yy)+61),yy),n=Math.abs(Math.round(y/170)+(side+1)*2),u=scale;if(v.y<-180||v.y>H+180)continue;c.save();c.translate(v.x,v.y);c.scale(u,u);const colors=['#b0bbc9','#d6adb1','#b8c9bc','#dcc59e'];ellipse(0,8,61,13,'#465c6c25');c.fillStyle='#8796a8';c.fillRect(-48,-93,96,100);c.fillStyle=colors[n%4];c.fillRect(-43,-95,86,99);c.strokeStyle='#718b9e';c.lineWidth=2.5;c.strokeRect(-43,-95,86,99);c.fillStyle=n%2?'#97a9bf':'#bb93a2';c.beginPath();c.moveTo(-52,-93);c.lineTo(0,-135);c.lineTo(52,-93);c.closePath();c.fill();c.strokeStyle='#e4dad3';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(-53,-93);c.lineTo(0,-136);c.lineTo(53,-93);c.stroke();c.fillStyle='#7691a7';c.fillRect(-14,-40,28,44);c.strokeStyle='#b1d9dd';c.lineWidth=2;c.strokeRect(-10,-36,20,26);ellipse(8,-12,1.5,1.5,'#f2d29c');for(const xx of [-25,25]){c.fillStyle='#f1dcb2';c.fillRect(xx-10,-77,20,22);c.strokeStyle='#788fa2';c.lineWidth=2;c.strokeRect(xx-10,-77,20,22);c.beginPath();c.moveTo(xx,-77);c.lineTo(xx,-55);c.moveTo(xx-10,-66);c.lineTo(xx+10,-66);c.stroke()}if(n%3===0){c.fillStyle='#f0e2cf';c.fillRect(-40,-51,80,10);for(let j=0;j<8;j++){c.fillStyle=j%2?'#eddfd0':'#c18e9e';c.beginPath();c.moveTo(-40+j*10,-51);c.lineTo(-30+j*10,-51);c.lineTo(-28+j*10,-38);c.quadraticCurveTo(-34+j*10,-31,-42+j*10,-38);c.closePath();c.fill()}}else{for(const xx of [-27,27]){c.fillStyle='#b28f99';c.fillRect(xx-12,-51,24,7);for(let j=-1;j<=1;j++)flower(xx+j*7,-55,4,j,true)}}c.fillStyle='#c7c3bc';c.fillRect(-20,4,40,6);c.restore();const q=view(riverX(yy)+side*(riverWidth(yy)-17),yy);c.save();bankPath(-5);c.clip();for(let i=0;i<4;i++)ellipse(q.x,q.y+i*9*scale,(9-i)*scale,2*scale,colors[n%4]+'20');c.restore();if(n%3===1){const z=view(riverX(yy+68)+side*(riverWidth(yy+68)+35),yy+68);c.save();c.translate(z.x,z.y);c.
